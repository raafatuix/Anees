  <style>
    /* =========================================================================
       THMANYAH SERIF DISPLAY CUSTOM FONT-FACE DEFINITIONS
       ========================================================================= */
    @font-face {
      font-family: 'thmanyah serif display';
      src: url('./fonts/thmanyahserifdisplay-Light.otf') format('opentype');
      font-weight: 300;
      font-style: normal;

    /* Amiri — خط الآيات، محلي (SIL Open Font License 1.1) */

      font-family: 'Amiri';
      src: url('./fonts/amiri-arabic-400-normal.woff2') format('woff2');

    /* =========================================================================
       ANEES DESIGN SYSTEM TOKENS (LIGHT & DARK MODES)
       ========================================================================= */
    :root {
      --bg-canvas: #F1EFEA;
      --bg-surface: #FFFFFF;
      --bg-surface-alt: #DFDDD7;
      --bg-pill-soft: #EFECE6;

      --color-primary: #20211F;
      --color-primary-soft: #DFDDD7;
      --color-accent: #DF713B;
      --bg-accent-soft: #F3DFD1;

      --text-primary: #20211F;
      --text-secondary: #4A4A41;
      --text-on-primary: #FFFFFF;
      --text-on-accent: #FFFFFF;

      --border-subtle: #D7D5CE;
      --shadow-card: 0px 4px 20px rgba(32, 33, 31, 0.04);
      --shadow-dock: 0px 8px 28px rgba(32, 33, 31, 0.08);

      --color-success: #426347;
      --bg-success-soft: #E4EBDF;
      --color-warning: #80551F;
      --bg-warning-soft: #F3E7D4;
      --color-error: #A33D36;
      --bg-error-soft: #F4E0DA;
      --color-info: #44617C;
      --bg-info-soft: #E1E8EF;
    }

    [data-theme="dark"] {
      --bg-canvas: #20211E;
      --bg-surface: #242622;
      --bg-surface-alt: #32352F;
      --bg-pill-soft: #2E312B;

      --color-primary: #F4F2EB;
      --color-primary-soft: #32352F;
      --color-accent: #F49B68;
      --bg-accent-soft: #443025;

      --text-primary: #F4F2EB;
      --text-secondary: #B8BAB0;
      --text-on-primary: #20211F;
      --text-on-accent: #20211F;

      --border-subtle: #41453D;
      --shadow-card: 0px 4px 20px rgba(0, 0, 0, 0.25);
      --shadow-dock: 0px 8px 28px rgba(0, 0, 0, 0.4);

      --color-success: #B1CAA1;
      --bg-success-soft: #2B3829;
      --color-warning: #E9C38A;
      --bg-warning-soft: #403524;
      --color-error: #F3AAA0;
      --bg-error-soft: #452B28;
      --color-info: #AFC9E0;
      --bg-info-soft: #293641;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: 'thmanyah serif display', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      overscroll-behavior-y: contain;
    }

    .font-quran {
      font-family: 'Amiri', serif;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    ::-webkit-scrollbar { width: 0px; height: 0px; }

    /* Design System Surfaces & Buttons */
    .ds-canvas { background-color: var(--bg-canvas); }
    .ds-surface {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-card);
    }
    .ds-surface-clean {
      background-color: var(--bg-surface);
      box-shadow: var(--shadow-card);
    }
    .ds-surface-alt {
      background-color: var(--bg-surface-alt);
    }
    .ds-pill-soft {
      background-color: var(--bg-pill-soft);
    }
    .ds-text-primary { color: var(--text-primary); }
    .ds-text-secondary { color: var(--text-secondary); }
    .ds-border { border-color: var(--border-subtle); }

    .ds-btn-primary {
      background-color: var(--color-primary);
      color: var(--text-on-primary);
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.18s ease, background-color 0.2s ease;
    }
    .ds-btn-primary:hover:not(:disabled) { opacity: 0.94; }
    .ds-btn-primary:active:not(:disabled) { transform: scale(0.97); }
    .ds-btn-primary:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    /* Sticky Bottom Action Container */
    .sticky-cta-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 35;
      pointer-events: none;
      background: linear-gradient(to top, var(--bg-canvas) 72%, color-mix(in srgb, var(--bg-canvas) 0%, transparent) 100%);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px)) 20px;
    }
    .sticky-cta-bar > div {
      max-width: 32rem;
      margin: 0 auto;
      pointer-events: auto;
    }

    /* Smart Animate & Smooth Micro-interactions */
    @keyframes splashLogoIn {
      0% { opacity: 0; transform: scale(0.84) translateY(16px); }
      65% { opacity: 1; transform: scale(1.03) translateY(-2px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes chipPopIn {
      0% { opacity: 0; transform: scale(0.85) translateY(4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }
    @keyframes twinkleStar {
      0%, 100% { opacity: 0.04; transform: scale(1); }
      50% { opacity: 0.09; transform: scale(1.06); }
    }
    @keyframes rayPulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes slideUpSheet {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes slideDownSheet {
      from { transform: translateY(0); }
      to { transform: translateY(100%); }
    }

    .splash-logo-anim { animation: splashLogoIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .splash-title-anim { opacity: 0; animation: fadeSlideUp 0.6s ease-out 0.32s forwards; }
    .splash-subtitle-anim { opacity: 0; animation: fadeSlideUp 0.6s ease-out 0.5s forwards; }
    .splash-footer-anim { opacity: 0; animation: fadeSlideUp 0.6s ease-out 0.68s forwards; }
    .bg-helal-anim { animation: gentleFloat 5s ease-in-out infinite; }
    .bg-star-anim { animation: twinkleStar 4s ease-in-out infinite; }
    .logo-rays { transform-origin: 28px 18px; animation: rayPulse 2.4s ease-in-out infinite; }

    .smart-fade { animation: fadeSlideUp 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .chip-enter { animation: chipPopIn 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .bottom-sheet-enter { animation: slideUpSheet 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .bottom-sheet-exit { animation: slideDownSheet 0.22s cubic-bezier(0.4, 0, 1, 1) forwards; }

    /* Custom Inputs & Selects */
    .anees-input {
      width: 100%;
      height: 52px;
      padding: 0 20px;
      border-radius: 999px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 18px;
      font-weight: 500;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .anees-input::placeholder { color: var(--text-secondary); opacity: 0.55; }
    .anees-input:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    .anees-select-wrap { position: relative; width: 100%; }
    .anees-select {
      width: 100%;
      height: 52px;
      padding: 0 20px 0 44px;
      border-radius: 999px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 18px;
      font-weight: 500;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    .anees-select:focus { outline: none; border-color: var(--color-primary); }
    .anees-select-chevron {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-primary);
    }

    /* Avatar Ring Selection */
    .avatar-btn {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .avatar-btn:active { transform: scale(0.92); }
    .avatar-btn.selected {
      box-shadow: 0 0 0 3px var(--bg-canvas), 0 0 0 5.5px var(--color-primary);
    }

    /* Option Cards */
    .option-card {
      width: 100%;
      padding: 18px 20px;
      border-radius: 24px;
      background-color: var(--bg-surface);
      border: 1.5px solid var(--border-subtle);
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      text-align: right;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }
    .option-card:active:not(.disabled) { transform: scale(0.985); }
    .option-card.selected {
      background-color: var(--bg-surface-alt);
      border-color: var(--color-primary);
    }
    .option-card.disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    .radio-circle {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1.5px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.2s ease;
    }
    .option-card.selected .radio-circle { border-color: var(--color-primary); }
    .radio-dot {
      width: 11px;
      height: 11px;
      border-radius: 999px;
      background-color: var(--color-primary);
      transform: scale(0);
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .option-card.selected .radio-dot { transform: scale(1); }

    /* Single-line Ayah Ellipsis */
    .ayah-single-line {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      width: 100%;
    }
  </style>

    const QUARTERS_BY_SURAH = (() => {
      const map = {};
      QUARTERS.forEach((q, idx) => q[3].forEach(sid => { (map[sid] = map[sid] || []).push(idx + 1); }));

    function getSurahName(surahId) {
      return SURAH_NAMES[surahId - 1] || '';
    }

    // كل الأرباع اللي السورة داخلة فيها (حتى لو جزء من الربع)
    function getQuartersOfSurah(surahId) {
      return QUARTERS_BY_SURAH[surahId] ? [...QUARTERS_BY_SURAH[surahId]] : [];
    }

    function getQuartersOfJuz(juzId) {
      const first = (juzId - 1) * 8 + 1;
      return Array.from({ length: 8 }, (_, i) => first + i);
    }

    function isValidQuarter(n) {
      return Number.isInteger(n) && n >= 1 && n <= 240;
    }

    function buildQuarterItem(n, addedAt) {
      const q = QUARTERS[n - 1];
      return {
        id: `q${n}`,
        quarter: n,
        juz: Math.ceil(n / 8),
        surahId: q[0],
        surahIds: q[3].slice(),
        surahName: getSurahName(q[0]),
        rubOrder: n,
        mushafRubNum: n,
        title: q[2],
        addedAt
      };
    }

    function getItemSurahLabel(item) {

      if (names.length <= 3) return names.join(' · ');
      return `${names.slice(0, 2).join(' · ')} +${names.length - 2}`;

      // (مؤشر النظام القديم ممكن يتزحزح لأن كذا سورة قصيرة بتتجمع في ربع واحد)
      if (src.quarterModel !== 1) {
        const lastTask = (Array.isArray(session.farTasks) ? session.farTasks : []).slice().reverse()
          .find(t => t && mapId(t.itemId) && !t.isExtra);
        const lastQuarter = lastTask ? Number(mapId(lastTask.itemId).slice(1)) : 0;
        if (lastQuarter && items.length) {
          const idx = items.findIndex(i => i.quarter > lastQuarter);
          pointerIndex = idx === -1 ? 0 : idx;
        }
      }

      const tasksById = new Map();
      (Array.isArray(session.farTasks) ? session.farTasks : []).forEach(t => {
        const id = t && mapId(t.itemId);
        if (!id || !validIds.has(id)) return;
        const prev = tasksById.get(id);
        tasksById.set(id, {
          itemId: id,
          done: t.done === true || (prev ? prev.done : false),
          carriedOver: t.carriedOver === true || (prev ? prev.carriedOver : false),
          isExtra: prev ? prev.isExtra && t.isExtra === true : t.isExtra === true
        });
      });
      const nearDoneIds = [...new Set((Array.isArray(session.nearDoneIds) ? session.nearDoneIds : []).map(mapId).filter(id => id && validIds.has(id)))];

      return {
        items,
        recentAddedIds,
        pointerIndex,
        todaySession: {
          date: typeof session.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(session.date) ? session.date : '',
          farTasks: [...tasksById.values()],
          nearDoneIds,
          carriedOverCount: 0
        }
      };
    }

    function escapeHTML(str) {

    }

    function getLocalTodayISO() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      const local = new Date(now.getTime() - offset * 60000);
      return local.toISOString().split('T')[0];
    }

    function getHijriDateFormatted() {
      const now = new Date();
      try {
        return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {
          weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        }).format(now);
      } catch (e) {
        return new Intl.DateTimeFormat('ar-EG', {
          weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        }).format(now);
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('anees_quran_v1');
        if (!raw) return JSON.parse(JSON.stringify(defaultState));
        const parsed = JSON.parse(raw);
        if (parsed.items && parsed.items.length > 0 && parsed.onboardingCompleted === undefined) {
          parsed.onboardingCompleted = true;
        }
        const merged = {
          ...JSON.parse(JSON.stringify(defaultState)),
          ...parsed,
          userProfile: { ...defaultState.userProfile, ...(parsed.userProfile || {}) }
        };

        // نقل البيانات لنظام الربع كوحدة (240 ربع) — بيشتغل كل مرة وبيرجع نفس النتيجة لو البيانات اتنقلت قبل كده
        const wasQuarterModel = parsed.quarterModel === 1;
        const normalized = normalizeToQuarterModel(parsed);
        merged.items = normalized.items;
        merged.recentAddedIds = normalized.recentAddedIds;
        merged.pointerIndex = normalized.pointerIndex;
        merged.todaySession = normalized.todaySession;
        if (!wasQuarterModel) merged.cycleReviewedCount = 0;
        merged.quarterModel = 1;
        delete merged.mushafRubVersion;
        return merged;
      } catch (e) {
        return JSON.parse(JSON.stringify(defaultState));
      }
    }

    function saveState() {
      try {
        sortItemsInMushafOrder();
        recordTodaySnapshot();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        showToast('تعذر حفظ البيانات محلياً', 'error');
      }
    }

    function sortItemsInMushafOrder() {
      const currentTargetId = state.items[state.pointerIndex]?.id;
      state.items.sort((a, b) => a.quarter - b.quarter);
      if (state.items.length === 0) {
        state.pointerIndex = 0;
      } else if (currentTargetId) {
        const idx = state.items.findIndex(i => i.id === currentTargetId);
        state.pointerIndex = idx !== -1 ? idx : (state.pointerIndex % state.items.length);
      } else {
        state.pointerIndex = state.pointerIndex % state.items.length;
      }
    }

    function getNearPastItems() {
      const limit = state.dailyNearLimit ?? 4;
      if (state.items.length === 0 || limit <= 0) return [];
      const validRecent = state.recentAddedIds
        .map(id => state.items.find(it => it.id === id))
        .filter(Boolean);

      let selected = [];
      if (validRecent.length >= limit) {
        selected = validRecent.slice(0, limit);
      } else {
        const sortedByRecent = [...state.items].sort((a, b) => b.addedAt - a.addedAt);
        selected = sortedByRecent.slice(0, Math.min(limit, sortedByRecent.length));
      }

      return selected.sort((a, b) => a.quarter - b.quarter);
    }

    function getNearIdSet() {
      return new Set(getNearPastItems().map(it => it.id));
    }

    // كل المحفوظ داخل في الماضي القريب، فمفيش أرباع للمراجعة الدورية لسه
    function isFarPoolEmpty() {
      return state.items.length > 0 && (state.dailyNearLimit ?? 0) > 0 && getFarPoolSize() === 0;
    }

    // حجم دورة الماضي البعيد = المحفوظ ناقص أرباع الماضي القريب
    function getFarPoolSize() {
      return Math.max(0, state.items.length - getNearIdSet().size);
    }

    function syncDailySession() {
      const todayISO = getLocalTodayISO();
      sortItemsInMushafOrder();

      state.todaySession.farTasks = (state.todaySession.farTasks || []).filter(t =>
        state.items.some(it => it.id === t.itemId)
      );
      state.todaySession.nearDoneIds = (state.todaySession.nearDoneIds || []).filter(id =>
        state.items.some(it => it.id === id)
      );

      if (state.todaySession.date === todayISO) {
        if (state.items.length > 0 && state.dailyFarLimit > 0) {
          reconcileTodayFarTasks();
          saveState();
        }
        return;
      }

      if (state.todaySession.date) {
        recordSnapshotForDate(state.todaySession.date);
      }

      const nearIds = getNearIdSet();

      // الربع الإضافي لليوم ده بس: لو ما اتراجعش ما يترحّلش، بس يرجع للدورة عشان ما يتخطاش
      const undoneExtraIds = (state.todaySession.farTasks || [])
        .filter(t => t.isExtra && !t.done && state.items.some(it => it.id === t.itemId))
        .map(t => t.itemId);
      state.farReturnQueue = [...new Set([...undoneExtraIds, ...(state.farReturnQueue || [])])];

      const uncompletedFromYesterday = (state.todaySession.farTasks || [])
        .filter(t => !t.done && !t.isExtra && !nearIds.has(t.itemId) && state.items.some(it => it.id === t.itemId))
        .map(t => ({ itemId: t.itemId, done: false, carriedOver: true }));

      state.todaySession = {
        date: todayISO,
        farTasks: [],
        nearDoneIds: [],
        carriedOverCount: uncompletedFromYesterday.length
      };

      if (state.items.length > 0) {
        populateFarTasksForToday(uncompletedFromYesterday);
      }

      saveState();
    }

    // يسحب الربع التالي في دورة الماضي البعيد بترتيب المصحف، متخطياً أي ربع مستبعد
    function pullNextFarCandidate(excludeIds) {
      // الأول: الأرباع الإضافية اللي اتسحبت قبل كده وما اتراجعتش، عشان ما تتخطاش من الدورة
      const queue = Array.isArray(state.farReturnQueue) ? state.farReturnQueue : [];
      while (queue.length) {
        const id = queue.shift();
        const queued = state.items.find(it => it.id === id);
        if (queued && !excludeIds.has(queued.id)) {
          state.farReturnQueue = queue;
          return queued;
        }
      }
      state.farReturnQueue = queue;

      const total = state.items.length;
      for (let safety = 0; safety < total; safety++) {
        const candidate = state.items[state.pointerIndex % total];
        state.pointerIndex = (state.pointerIndex + 1) % total;
        if (!excludeIds.has(candidate.id)) return candidate;
      }
      return null;
    }

    function populateFarTasksForToday(carriedTasks) {
      if (state.items.length === 0) return;
      state.todaySession.farTasks = [...carriedTasks];
      reconcileTodayFarTasks();
    }

    // يشيل من ورد اليوم أي ربع بعيد (غير منجز) بقى ضمن الماضي القريب، ويكمّل العدد من الدورة
    function reconcileTodayFarTasks() {
      if (state.items.length === 0) return;
      const nearIds = getNearIdSet();
      const tasks = (state.todaySession.farTasks || []).filter(t => t.done || !nearIds.has(t.itemId));
      const targetCount = Math.min(state.dailyFarLimit, Math.max(0, state.items.length - nearIds.size));
      const exclude = new Set([...nearIds, ...tasks.map(t => t.itemId)]);

      while (tasks.filter(t => !t.isExtra).length < targetCount) {
        const candidate = pullNextFarCandidate(exclude);
        if (!candidate) break;
        tasks.push({ itemId: candidate.id, done: false, carriedOver: false });
        exclude.add(candidate.id);
      }

      state.todaySession.farTasks = tasks;
      state.todaySession.carriedOverCount = tasks.filter(t => t.carriedOver).length;
    }

    // لو التاريخ اتغير والتطبيق مفتوح (رجع من الخلفية مثلاً) يبدأ ورد اليوم الجديد
    function ensureTodaySession() {
      if (!state.onboardingCompleted) return false;
      if (state.todaySession.date === getLocalTodayISO()) return false;
      syncDailySession();
      if (isReviewOpen) renderReviewFullScreen();
      renderApp();
      // التوست بيظهر بس لو فيه ربع اتنقل من إمبارح (مش مراجَع)
      if (state.todaySession.farTasks.some(t => t.carriedOver)) {
        showToast('بدأ يوم جديد، وانتقل ما تبقّى من أمس إلى وردك', 'info');
      }
      return true;
    }

    function addExtraRubToToday() {
      if (state.items.length === 0) return;
      if (ensureTodaySession()) return;

      const nearIds = getNearIdSet();
      const exclude = new Set([...nearIds, ...state.todaySession.farTasks.map(t => t.itemId)]);
      const candidate = exclude.size < state.items.length ? pullNextFarCandidate(exclude) : null;

      if (!candidate) {
        showToast('لقد أضفت جميع أرباع محفوظك في قائمة اليوم ما شاء الله!', 'info');
        return;
      }

      state.todaySession.farTasks.push({
        itemId: candidate.id,
        done: false,
        carriedOver: false,
        isExtra: true
      });

      saveState();
      if (isReviewOpen) renderReviewFullScreen();
      renderApp();
      showToast('تم إضافة ربع إضافي لورد اليوم', 'info');
    }

    function removeExtraTaskFromToday(itemId) {
      if (ensureTodaySession()) return;
      const idx = state.todaySession.farTasks.findIndex(t => t.itemId === itemId && t.isExtra);
      if (idx === -1) return;
      const [removed] = state.todaySession.farTasks.splice(idx, 1);
      if (!removed.done) {
        state.farReturnQueue = [removed.itemId, ...(state.farReturnQueue || []).filter(id => id !== removed.itemId)];
      }
      saveState();
      if (isReviewOpen) renderReviewFullScreen();
      renderApp();
    }

    function toggleFarTaskDone(itemId) {
      if (ensureTodaySession()) return;
      const task = state.todaySession.farTasks.find(t => t.itemId === itemId);
      if (!task) return;

      task.done = !task.done;
      if (task.done) {
        state.cycleReviewedCount += 1;
        const poolSize = getFarPoolSize();
        if (poolSize > 0 && state.cycleReviewedCount >= poolSize) {
          state.cycleReviewedCount = 0;
          state.completedCycles += 1;
          showToast(`مبارك! أتممت دورة مراجعة كاملة (${state.completedCycles})`, 'info');
        }
      } else {
        state.cycleReviewedCount = Math.max(0, state.cycleReviewedCount - 1);
      }

      saveState();
      if (isReviewOpen) renderReviewFullScreen();
      renderApp();
    }

    function toggleNearTaskDone(itemId) {
      if (ensureTodaySession()) return;
      const idx = state.todaySession.nearDoneIds.indexOf(itemId);
      if (idx === -1) {
        state.todaySession.nearDoneIds.push(itemId);
      } else {
        state.todaySession.nearDoneIds.splice(idx, 1);
      }
      saveState();
      if (isReviewOpen) renderReviewFullScreen();
      renderApp();
    }

    function recordTodaySnapshot() {
      recordSnapshotForDate(state.todaySession.date || getLocalTodayISO());
    }

    function recordSnapshotForDate(dateISO) {
      if (!dateISO) return;
      const nearItems = getNearPastItems();
      const farTasks = state.todaySession.farTasks || [];
      const nearDoneCount = nearItems.filter(it => (state.todaySession.nearDoneIds || []).includes(it.id)).length;
      const farDoneCount = farTasks.filter(t => t.done).length;

      state.historyLogs[dateISO] = {
        totalTasks: nearItems.length + farTasks.length,
        completedTasks: nearDoneCount + farDoneCount,
        farDone: farDoneCount,
        farTotal: farTasks.length,
        nearDone: nearDoneCount,
        nearTotal: nearItems.length

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') ensureTodaySession();
      });
      window.addEventListener('focus', () => ensureTodaySession());
      setInterval(() => ensureTodaySession(), 60000);

      const duration = state.onboardingCompleted ? 1200 : 2600;
      splashTimeoutId = setTimeout(finishSplash, duration);

    function requestPersistentStorage() {
      try {
        if (navigator.storage && navigator.storage.persist) {
          navigator.storage.persisted().then(isPersisted => {
            if (!isPersisted) navigator.storage.persist().catch(() => {});
          }).catch(() => {});
        }
      } catch (e) {}
    }

    function skipSplash() {
      if (splashTimeoutId) clearTimeout(splashTimeoutId);
      finishSplash();

      const splash = document.getElementById('splashScreen');
      if (!splash || splash.classList.contains('hidden')) return;

          enterMainApp();

          enterOnboarding();

    function setObHifzTab(tab) {

          btn.style.color = 'var(--text-on-primary)';

    function renderObHifzDropdownsOnly() {
      const box = document.getElementById('obHifzDropdownContainer');
      if (!box) return;
      box.innerHTML = renderHifzDropdownsHTML({
        tab: obHifzTab,

        onJuz: "handleObAddJuz(this.value); this.value='';",
        onSurah: "handleObAddSurah(this.value); this.value='';",
        onSelectSurahForRub: 'handleObSelectSurahForRub(this.value)',
        onRub: "handleObAddUptoRub(this.value); this.value='';",

    // القوائم المنسدلة لإضافة المحفوظ (مشتركة بين الإعداد الأولي ونافذة الإضافة)
    function renderHifzDropdownsHTML(opts) {

        </svg>`;

          <div class="smart-fade">
            <label class="${opts.labelClass}">اختيار الجزء</label>
            <div class="anees-select-wrap">
              <select onchange="${opts.onJuz}" class="anees-select">
                <option value="" disabled selected>اختر الجزء</option>
                ${JUZ_NAMES.map((name, i) => `<option value="${i + 1}">${name}</option>`).join('')}
              </select>
              ${chevron}
            </div>
          </div>

          <div class="smart-fade">
            <label class="${opts.labelClass}">اختيار السورة</label>
            <div class="anees-select-wrap">
              <select onchange="${opts.onSurah}" class="anees-select">

                ${surahOptions('')}
              </select>

                <option value="" disabled selected>اختر الربع</option>
                ${quarters.map(n => `<option value="${n}">الربع ${n} · ${QUARTERS[n - 1][2]}</option>`).join('')}

    function makeJuzChip(juzId) {
      return { uid: `juz_${juzId}`, type: 'juz', label: JUZ_NAMES[juzId - 1], sortOrder: getQuartersOfJuz(juzId)[0] * 10, juzId };
    }

    function makeSurahChip(surahId) {
      return { uid: `surah_${surahId}`, type: 'surah', label: `سورة ${getSurahName(surahId)}`, sortOrder: getQuartersOfSurah(surahId)[0] * 10 + 1, surahId };
    }

    function makeRubChip(surahId, uptoQuarter) {
      return {
        uid: `rub_${surahId}_${uptoQuarter}`,
        type: 'rub',
        label: `سورة ${getSurahName(surahId)} (حتى الربع ${uptoQuarter})`,
        sortOrder: getQuartersOfSurah(surahId)[0] * 10 + 2,
        surahId,
        uptoQuarter
      };
    }

    // الأرباع اللي يمثلها اختيار واحد (جزء / سورة / حتى ربع)
    function getQuartersFromChip(chip) {
      if (chip.type === 'juz') return getQuartersOfJuz(chip.juzId);
      if (chip.type === 'surah') return getQuartersOfSurah(chip.surahId);
      if (chip.type === 'rub') return getQuartersOfSurah(chip.surahId).filter(n => n <= chip.uptoQuarter);
      return [];
    }

    function renderObChipsOnly() {
      const section = document.getElementById('obChipsSection');
      const list = document.getElementById('obChipsList');
      const nextBtn = document.getElementById('obStep3NextBtn');
      if (!section || !list) return;

      sortChipsInMushafOrder(obChips);

      if (obChips.length === 0) {
        section.classList.add('hidden');
        list.innerHTML = '';
        if (nextBtn) nextBtn.disabled = true;
        return;
      }

      section.classList.remove('hidden');
      if (nextBtn) nextBtn.disabled = false;
      list.innerHTML = obChips.map(chip => `
        <span class="chip-enter inline-flex items-center gap-2 px-4 py-2 rounded-full text-[16px] font-medium ds-surface ds-text-primary">
          <span>${chip.label}</span>
          <button type="button" onclick="removeObChip('${chip.uid}')" aria-label="إزالة" class="w-4 h-4 flex items-center justify-center ds-text-secondary hover:opacity-75">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </span>
      `).join('');
    }

    function handleObAddJuz(juzId) {
      const id = Number(juzId);
      if (!JUZ_NAMES[id - 1]) return;
      if (obChips.some(c => c.type === 'juz' && c.juzId === id)) {
        showToast(`${JUZ_NAMES[id - 1]} مضاف بالفعل`, 'info');
        return;
      }
      obChips.push(makeJuzChip(id));
      renderObChipsOnly();
    }

    function handleObAddSurah(surahId) {
      const id = Number(surahId);
      if (!getSurahName(id)) return;
      if (obChips.some(c => c.type === 'surah' && c.surahId === id)) {
        showToast(`سورة ${getSurahName(id)} مضافة بالفعل`, 'info');
        return;
      }
      obChips = obChips.filter(c => !(c.type === 'rub' && c.surahId === id));
      obChips.push(makeSurahChip(id));
      renderObChipsOnly();
    }

    function handleObSelectSurahForRub(surahId) {
      obSelectedSurahForRub = surahId;
      renderObHifzDropdownsOnly();
    }

    function handleObAddUptoRub(uptoQuarter) {
      const surahId = Number(obSelectedSurahForRub);
      const n = Number(uptoQuarter);
      if (!getSurahName(surahId) || !isValidQuarter(n)) return;

      obChips = obChips.filter(c => !((c.type === 'rub' || c.type === 'surah') && c.surahId === surahId));
      obChips.push(makeRubChip(surahId, n));

      obSelectedSurahForRub = '';
      renderObHifzDropdownsOnly();
      renderObChipsOnly();
    }

    function removeObChip(uid) {
      obChips = obChips.filter(c => c.uid !== uid);
      renderObChipsOnly();
    }

    function selectObFullPace(rubs) {
      obFullPace = rubs;
      document.querySelectorAll('#obFullPaceCards .option-card[data-pace]').forEach(card => {
        card.classList.toggle('selected', Number(card.dataset.pace) === rubs);
      });
      const btn = document.getElementById('obStep4FullStartBtn');
      if (btn) btn.disabled = false;
    }

    function adjustObWird(type, delta) {
      if (type === 'near') {
        obCustomNear = Math.max(1, Math.min(20, obCustomNear + delta));
        const cEl = document.getElementById('obNearCountText');
        const uEl = document.getElementById('obNearUnitText');
        const decBtn = document.getElementById('obNearDecBtn');
        if (cEl) cEl.textContent = obCustomNear;
        if (uEl) uEl.textContent = obCustomNear === 1 ? 'ربع' : 'أرباع';
        if (decBtn) decBtn.classList.toggle('opacity-60', obCustomNear <= 1);
      } else {
        obCustomFar = Math.max(1, Math.min(30, obCustomFar + delta));
        const cEl = document.getElementById('obFarCountText');
        const uEl = document.getElementById('obFarUnitText');
        const decBtn = document.getElementById('obFarDecBtn');
        if (cEl) cEl.textContent = obCustomFar;
        if (uEl) uEl.textContent = obCustomFar === 1 ? 'ربع' : 'أرباع';
        if (decBtn) decBtn.classList.toggle('opacity-60', obCustomFar <= 1);
      }
      updateObWirdSummaryDOM();
    }

    function updateObWirdSummaryDOM() {
      const p = document.getElementById('obWirdSummaryText');
      const startBtn = document.getElementById('obStep4CustomStartBtn');
      const estimatedTotalRubs = calculateEstimatedRubsFromChips(obChips);
      const totalDailyRubs = obCustomNear + obCustomFar;
      const farPoolRubs = Math.max(0, estimatedTotalRubs - obCustomNear);
      const cycleDays = obCustomFar > 0 ? Math.max(1, Math.ceil(farPoolRubs / obCustomFar)) : 0;

      if (startBtn) startBtn.disabled = totalDailyRubs <= 0;
      if (!p) return;

      let juzEquivalentText = '';
      if (totalDailyRubs === 8) juzEquivalentText = ' (جزء واحد)';
      else if (totalDailyRubs === 4) juzEquivalentText = ' (نصف جزء)';
      else if (totalDailyRubs === 16) juzEquivalentText = ' (جزءان)';
      else if (totalDailyRubs > 8 && totalDailyRubs % 8 === 0) juzEquivalentText = ` (${totalDailyRubs / 8} أجزاء)`;

      p.innerHTML = `
        إجمالي وردك اليومي: <strong>${totalDailyRubs} ${totalDailyRubs === 1 ? 'ربع' : 'أرباع'}${juzEquivalentText}</strong>
        ${obCustomFar > 0
          ? ` - تُتمّ دورة مراجعة محفوظك كاملاً كل <strong>${cycleDays} ${cycleDays === 1 ? 'يوم' : cycleDays === 2 ? 'يومين' : cycleDays <= 10 ? 'أيام' : 'يوماً'}</strong>.`
          : ` - (تسميع يومي للماضي القريب فقط).`}
      `;
    }

    function calculateEstimatedRubsFromChips(chipsArr) {
      const quarters = new Set();
      chipsArr.forEach(chip => getQuartersFromChip(chip).forEach(n => quarters.add(n)));
      return Math.max(1, quarters.size);
    }

    function commitChipsToLibrary(chipsArr, clearFirst = false) {
      if (clearFirst) {
        state.items = [];
        state.recentAddedIds = [];
        state.pointerIndex = 0;
        state.cycleReviewedCount = 0;
      }

      const quarters = new Set();
      chipsArr.forEach(chip => getQuartersFromChip(chip).forEach(n => quarters.add(n)));
      const newlyAddedIds = addQuartersSilent([...quarters].sort((a, b) => a - b));

      if (newlyAddedIds.length > 0) {
        const combined = [...newlyAddedIds.reverse(), ...state.recentAddedIds];
        state.recentAddedIds = [...new Set(combined)].slice(0, 25);
      }
      return newlyAddedIds.length;
    }

    // يضيف الأرباع اللي مش موجودة، ويرجّع الـ ids الجديدة بترتيب المصحف
    function addQuartersSilent(quarterNumbers) {
      const existing = new Set(state.items.map(it => it.quarter));
      const addedIds = [];
      const now = Date.now();
      quarterNumbers.forEach((n, i) => {
        if (!isValidQuarter(n) || existing.has(n)) return;
        state.items.push(buildQuarterItem(n, now + i));
        existing.add(n);
        addedIds.push(`q${n}`);
      });
      return addedIds;
    }

    function completeOnboardingFlow() {
      if (obScope === 'full') {
        state.items = [];
        state.recentAddedIds = [];
        state.pointerIndex = 0;
        state.cycleReviewedCount = 0;
        addQuartersSilent(Array.from({ length: 240 }, (_, i) => i + 1));
        state.dailyNearLimit = 0;
        state.dailyFarLimit = obFullPace || 8;
      } else {
        commitChipsToLibrary(obChips, true);
        state.dailyNearLimit = obCustomNear;
        state.dailyFarLimit = obCustomFar;
      }

      sortItemsInMushafOrder();
      state.todaySession = {
        date: getLocalTodayISO(),
        farTasks: [],
        nearDoneIds: [],
        carriedOverCount: 0
      };
      populateFarTasksForToday([]);
      state.onboardingCompleted = true;
      saveState();

      enterMainApp();
    }

     * 5. THEME & FLOATING TOAST (MATCHES FIGMA DARK SLATE TOAST)

    function applyTheme() {
      const html = document.documentElement;
      const metaTheme = document.getElementById('metaThemeColor');
      if (state.darkMode) {
        html.setAttribute('data-theme', 'dark');
        if (metaTheme) metaTheme.setAttribute('content', '#20211E');

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      container.innerHTML = '';

      const toast = document.createElement('div');
      let bg = '#44617C';
      if (type === 'error') bg = '#A33D36';
      else if (type === 'success') bg = '#426347';

      toast.style.cssText = `background-color: ${bg}; color: #FFFFFF;`;
      toast.className = 'px-5 py-3.5 rounded-full shadow-xl text-[16px] font-medium flex items-center justify-start text-right gap-2.5 smart-fade w-full';
      toast.innerHTML = `
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 11v5m0-8h.01" />
        </svg>
        <span>${message}</span>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 250);

    function getTodaySummaryData() {
      const nearItems = getNearPastItems();
      const farTasks = state.todaySession.farTasks || [];
      const nearDoneCount = nearItems.filter(it => state.todaySession.nearDoneIds.includes(it.id)).length;
      const farDoneCount = farTasks.filter(t => t.done).length;
      const totalToday = nearItems.length + farTasks.length;
      const doneToday = nearDoneCount + farDoneCount;
      const todayPct = totalToday > 0 ? Math.round((doneToday / totalToday) * 100) : 0;

      // السور اللي في ورد اليوم، بترتيب المصحف
      const surahIdsSet = new Set();
      nearItems.forEach(it => it.surahIds.forEach(id => surahIdsSet.add(id)));
      farTasks.forEach(t => {
        const it = state.items.find(x => x.id === t.itemId);
        if (it) it.surahIds.forEach(id => surahIdsSet.add(id));
      });

      return {
        nearItems,
        farTasks,
        nearDoneCount,
        farDoneCount,
        totalToday,
        doneToday,
        todayPct,
        surahNames: [...surahIdsSet].sort((a, b) => a - b).map(getSurahName)
      };
    }

    function calculateStreak() {
      let streak = 0;
      const now = new Date();
      for (let i = 0; i < 60; i++) {
        const d = new Date(now.getTime() - i * 86400000);
        const offset = d.getTimezoneOffset();
        const iso = new Date(d.getTime() - offset * 60000).toISOString().split('T')[0];
        const log = state.historyLogs[iso];
        if (log && log.completedTasks > 0) streak++;
        else if (i > 0) break;
      }
      return streak;
    }

    // هل اتراجع في اليوم ده؟ (offset: 0 النهارده، 1 إمبارح...)
    function didReviewDaysAgo(offset) {
      const d = new Date(Date.now() - offset * 86400000);
      const iso = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split('T')[0];
      const log = state.historyLogs[iso];
      return !!(log && log.completedTasks > 0);
    }

    // الهمة: يومين متتاليين = عالية | انقطع يوم = طيبة | يومين من غير مراجعة = ضعيفة
    function getHemmaLevel() {
      const t = didReviewDaysAgo(0), y = didReviewDaysAgo(1), y2 = didReviewDaysAgo(2);
      if (t || y) {
        const streakNow = calculateStreak();
        return streakNow >= 2 ? 'high' : 'good';
      }
      return y2 ? 'good' : 'weak';
    }

    function getLast7DaysChartData() {
      const days = [];
      const dayNames = ['الأحد', 'الاثنين', 'الثلاثاء', 'الاربعاء', 'الخميس', 'الجمعة', 'السبت'];
      const now = new Date();

      // زي فيجما: ٤ أيام فاتت + النهارده + يومين جايين (الأقدم على اليمين)
      for (let i = 4; i >= -2; i--) {
        const d = new Date(now.getTime() - i * 86400000);
        const offset = d.getTimezoneOffset();
        const iso = new Date(d.getTime() - offset * 60000).toISOString().split('T')[0];
        const log = state.historyLogs[iso];
        const pct = (log && log.totalTasks > 0) ? Math.min(100, Math.round((log.completedTasks / log.totalTasks) * 100)) : 0;
        days.push({
          iso,
          label: dayNames[d.getDay()],
          pct
        });
      }
      return days;
    }

    // =========================================================================
    // VIEW C: ARCHIVES / MEMORIZED (المحفوظ - MATCHING FIGMA 100%)
    // =========================================================================
    function getLibraryJuzGroups() {
      const groups = [];
      state.items.forEach(item => {
        let group = groups.find(g => g.juzId === item.juz);
        if (!group) {
          group = { juzId: item.juz, juzName: JUZ_NAMES[item.juz - 1], items: [] };
          groups.push(group);
        }
        group.items.push(item);
      });

      const q = normalizeArabicForSearch(librarySearch);
      if (!q) return groups;
      return groups.map(g => {
        if (normalizeArabicForSearch(g.juzName).includes(q)) return g;
        const matchingItems = g.items.filter(it =>
          normalizeArabicForSearch(it.title).includes(q) ||
          it.surahIds.some(id => normalizeArabicForSearch(getSurahName(id)).includes(q))
        );
        return matchingItems.length > 0 ? { ...g, items: matchingItems } : null;
      }).filter(Boolean);
    }

    function adjustSettingsWird(type, delta) {
      const nearWarnEl = document.getElementById('settingsNearWarning');
      const farWarnEl = document.getElementById('settingsFarWarning');
      const nearDecBtn = document.getElementById('settingsNearDecBtn');
      const farDecBtn = document.getElementById('settingsFarDecBtn');

      if (type === 'near') {
        const currentNear = Math.max(1, state.dailyNearLimit || 1);
        const nextNear = currentNear + delta;
        if (nextNear < 1) {
          settingsLimitWarning = 'near';
          if (nearWarnEl) nearWarnEl.classList.remove('hidden');
          if (farWarnEl) farWarnEl.classList.add('hidden');
          if (nearDecBtn) nearDecBtn.classList.add('opacity-60');
          return;
        }
        settingsLimitWarning = '';
        state.dailyNearLimit = nextNear;
        if (nearWarnEl) nearWarnEl.classList.add('hidden');
        if (farWarnEl) farWarnEl.classList.add('hidden');
        const cEl = document.getElementById('settingsNearCount');
        const uEl = document.getElementById('settingsNearUnit');
        if (cEl) cEl.textContent = nextNear;
        if (uEl) uEl.textContent = nextNear === 1 ? 'ربع' : 'أرباع';
        if (nearDecBtn) nearDecBtn.classList.toggle('opacity-60', nextNear <= 1);
      } else {
        const currentFar = Math.max(1, state.dailyFarLimit || 1);
        const nextFar = currentFar + delta;
        if (nextFar < 1) {
          settingsLimitWarning = 'far';
          if (farWarnEl) farWarnEl.classList.remove('hidden');
          if (nearWarnEl) nearWarnEl.classList.add('hidden');
          if (farDecBtn) farDecBtn.classList.add('opacity-60');
          return;
        }
        settingsLimitWarning = '';
        state.dailyFarLimit = nextFar;
        if (farWarnEl) farWarnEl.classList.add('hidden');
        if (nearWarnEl) nearWarnEl.classList.add('hidden');
        const cEl = document.getElementById('settingsFarCount');
        const uEl = document.getElementById('settingsFarUnit');
        if (cEl) cEl.textContent = nextFar;
        if (uEl) uEl.textContent = nextFar === 1 ? 'ربع' : 'أرباع';
        if (farDecBtn) farDecBtn.classList.toggle('opacity-60', nextFar <= 1);
      }

      reconcileTodayFarTasks();
      saveState();
    }

    function exportBackupToClipboard() {
      const dataStr = JSON.stringify(state);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(dataStr).then(() => {
          showToast('تم نسخ كود النسخة الاحتياطية إلى الحافظة', 'success');
        }).catch(() => fallbackCopy(dataStr));
      } else {
        fallbackCopy(dataStr);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('تم نسخ كود النسخة الاحتياطية إلى الحافظة', 'success');
      } catch (e) {
        showToast('تعذر النسخ التلقائي', 'error');
      }
      document.body.removeChild(ta);
    }

    function resetCycleFromStart() {
      state.pointerIndex = 0;

      populateFarTasksForToday([]);

      if (navigator.share) {
        navigator.share({ title: 'آنيس', text, url: window.location.href }).catch(() => {});
      } else {

${window.location.href}`);

    let lockedScrollY = 0;

    function lockBackgroundScroll() {
      lockedScrollY = window.scrollY || document.documentElement.scrollTop || 0;
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';
      document.body.style.position = 'fixed';
      document.body.style.top = `-${lockedScrollY}px`;
      document.body.style.left = '0';
      document.body.style.right = '0';
      document.body.style.width = '100%';
    }

    function unlockBackgroundScroll() {
      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';
      document.body.style.position = '';
      document.body.style.top = '';
      document.body.style.left = '';
      document.body.style.right = '';
      document.body.style.width = '';
      window.scrollTo(0, lockedScrollY);
    }

    function openUniversalSheet(htmlContent) {
      const sheet = document.getElementById('universalSheet');
      const panel = document.getElementById('universalSheetPanel');
      const body = document.getElementById('universalSheetBody');
      if (!sheet || !panel || !body) return;

      body.innerHTML = htmlContent;
      body.scrollTop = 0;
      panel.style.transform = '';
      panel.style.transition = '';
      panel.classList.remove('bottom-sheet-exit');
      panel.classList.add('bottom-sheet-enter');
      sheet.classList.remove('hidden');
      sheet.classList.add('flex');
      lockBackgroundScroll();
    }

    function closeUniversalSheet() {
      const sheet = document.getElementById('universalSheet');
      const panel = document.getElementById('universalSheetPanel');
      if (!sheet || !panel) return;

      panel.classList.remove('bottom-sheet-enter');
      panel.classList.remove('bottom-sheet-exit');
      // Force reflow so transition runs smoothly from whatever translateY(currentY) it currently has
      void panel.offsetHeight;
      panel.style.transition = 'transform 0.24s cubic-bezier(0.32, 0.72, 0, 1)';
      panel.style.transform = 'translateY(100%)';
      sheet.style.transition = 'opacity 0.24s ease';
      sheet.style.opacity = '0';

      setTimeout(() => {
        sheet.classList.add('hidden');
        sheet.classList.remove('flex');
        sheet.style.opacity = '';
        sheet.style.transition = '';
        panel.style.transform = '';
        panel.style.transition = '';
        unlockBackgroundScroll();
      }, 240);
    }

    function handleSheetBackdropClick(e) {
      if (e.target && e.target.id === 'universalSheet') {
        closeUniversalSheet();
      }
    }

    function initBottomSheetGestures() {
      const sheet = document.getElementById('universalSheet');
      const panel = document.getElementById('universalSheetPanel');
      const body = document.getElementById('universalSheetBody');
      if (!sheet || !panel || !body) return;

      let startY = 0;
      let currentY = 0;
      let isDragging = false;

      // Prevent touchmove on backdrop from scrolling background
      sheet.addEventListener('touchmove', (e) => {
        if (e.target === sheet) {
          e.preventDefault();
        }
      }, { passive: false });

      panel.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        startY = e.touches[0].clientY;
        currentY = 0;
        isDragging = true;
        panel.style.transition = 'none';
        panel.classList.remove('bottom-sheet-enter');
      }, { passive: true });

      panel.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const deltaY = e.touches[0].clientY - startY;
        // Drag down to dismiss whenever body is scrolled to top (or dragging the handle/header)
        if (deltaY > 0 && body.scrollTop <= 0) {
          e.preventDefault();
          currentY = deltaY;
          panel.style.transform = `translateY(${currentY}px)`;
        }
      }, { passive: false });

      panel.addEventListener('touchend', () => {
        if (!isDragging) return;
        isDragging = false;
        const dragged = currentY;
        currentY = 0;
        if (dragged > 75) {
          closeUniversalSheet();
        } else if (dragged > 0) {
          panel.style.transition = 'transform 0.24s cubic-bezier(0.22, 1, 0.36, 1)';
          panel.style.transform = 'translateY(0px)';
        }
      });
    }

    // يبني حالة نظيفة من كود النسخة الاحتياطية: يقبل بس الحقول المعروفة،
    // ويعيد بناء الأرباع من بيانات المصحف نفسها بدل النصوص اللي جاية في الكود
    function sanitizeRestoredState(parsed) {
      if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.items)) throw new Error('Invalid');

      const toInt = (v, min, max, fallback) => {
        const n = Math.floor(Number(v));
        return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
      };
      const isISODate = (v) => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);

      const clean = JSON.parse(JSON.stringify(defaultState));

      // الأرباع تتبني من بيانات المصحف نفسها (نظام الـ 240 ربع)، مش من النصوص اللي جاية في الكود
      const normalized = normalizeToQuarterModel(parsed);
      clean.items = normalized.items;
      clean.recentAddedIds = normalized.recentAddedIds;
      clean.pointerIndex = normalized.pointerIndex;
      clean.dailyNearLimit = toInt(parsed.dailyNearLimit, 0, 20, 4);
      clean.dailyFarLimit = toInt(parsed.dailyFarLimit, 1, 30, 4);
      clean.cycleReviewedCount = toInt(parsed.cycleReviewedCount, 0, 100000, 0);
      clean.completedCycles = toInt(parsed.completedCycles, 0, 100000, 0);
      clean.darkMode = parsed.darkMode === true;
      clean.quarterModel = 1;

      const profile = parsed.userProfile && typeof parsed.userProfile === 'object' ? parsed.userProfile : {};
      clean.userProfile = {
        name: typeof profile.name === 'string' ? profile.name.trim().slice(0, 40) : '',
        pronoun: profile.pronoun === 'sister' ? 'sister' : 'brother',
        avatarId: AVATARS.some(a => a.id === profile.avatarId) ? profile.avatarId : 'letter'
      };

      const logs = parsed.historyLogs && typeof parsed.historyLogs === 'object' ? parsed.historyLogs : {};
      Object.keys(logs).forEach(dateKey => {
        const log = logs[dateKey];
        if (!isISODate(dateKey) || !log || typeof log !== 'object') return;
        clean.historyLogs[dateKey] = {
          totalTasks: toInt(log.totalTasks, 0, 1000, 0),
          completedTasks: toInt(log.completedTasks, 0, 1000, 0),
          farDone: toInt(log.farDone, 0, 1000, 0),
          farTotal: toInt(log.farTotal, 0, 1000, 0),
          nearDone: toInt(log.nearDone, 0, 1000, 0),
          nearTotal: toInt(log.nearTotal, 0, 1000, 0)
        };
      });

      clean.todaySession = normalized.todaySession;

      clean.onboardingCompleted = true;
      return clean;
    }

    function executeRestoreBackup() {
      const raw = document.getElementById('restoreJsonTextarea')?.value?.trim();

            <p class="text-[16px] ds-text-secondary mt-1.5 leading-relaxed">
              سيتم حذف جميع السور والأرباع المسجلة وسجل أيامك نهائياً. هل أنت متأكد؟
            </p>
          </div>

          <button type="button" onclick="confirmWipeAllData()" class="w-full h-14 rounded-full text-white font-medium text-[18px] flex items-center justify-center gap-2 active:scale-98 transition" style="background-color: var(--color-error);">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            <span>مسح جميع المحفوظات</span>
          </button>
        </div>
      `);
    }

    function openDeleteJuzSheet(juzId) {
      const juzName = JUZ_NAMES[juzId - 1];
      if (!juzName) return;
      openUniversalSheet(`
        <div class="text-center space-y-4 pt-2">
          <div class="w-16 h-16 rounded-full mx-auto flex items-center justify-center" style="background-color: var(--bg-error-soft); color: var(--color-error);">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </div>

          <div>
            <h3 class="text-xl font-bold ds-text-primary">حذف ${juzName}</h3>
            <p class="text-[16px] ds-text-secondary mt-1.5 leading-relaxed">
              هل أنت متأكد من حذف كل أرباع ${juzName} من محفوظاتك؟
            </p>
          </div>

          <button type="button" onclick="confirmDeleteJuzGroup(${juzId})" class="w-full h-14 rounded-full text-white font-medium text-[18px] flex items-center justify-center gap-2 active:scale-98 transition" style="background-color: var(--color-error);">
            <span>حذف الجزء</span>
          </button>
        </div>
      `);
    }

    function confirmDeleteJuzGroup(juzId) {
      const juzName = JUZ_NAMES[juzId - 1];
      const removedIds = new Set(state.items.filter(i => i.juz === juzId).map(i => i.id));
      state.items = state.items.filter(i => i.juz !== juzId);
      state.recentAddedIds = state.recentAddedIds.filter(id => !removedIds.has(id));
      state.todaySession.farTasks = state.todaySession.farTasks.filter(t => !removedIds.has(t.itemId));
      state.todaySession.nearDoneIds = state.todaySession.nearDoneIds.filter(id => !removedIds.has(id));
      sortItemsInMushafOrder();
      reconcileTodayFarTasks();
      saveState();
      closeUniversalSheet();
      renderApp();
      showToast(`تم حذف ${juzName}`, 'error');
    }

    function confirmWipeAllData() {
      const keepDark = state.darkMode;
      state = JSON.parse(JSON.stringify(defaultState));
      state.darkMode = keepDark;
      obChips = [];
      obScope = '';
      obFullPace = 0;
      saveState();
      closeUniversalSheet();
      enterOnboarding();
    }

    /**
     * =========================================================================
     * 8. INITIALIZATION & PWA SERVICE WORKER
     * =========================================================================
     */
    window.addEventListener('DOMContentLoaded', startAppFlow);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
