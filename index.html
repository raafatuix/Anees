<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <meta name="theme-color" content="#F1EFEA" id="metaThemeColor" />

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2320211F'/%3E%3Cpath d='M58 24c-11.5 3.2-19.5 13.7-19.5 26s8 22.8 19.5 26c-3.5 1.5-7.4 2.3-11.5 2.3-15.6 0-28.3-12.7-28.3-28.3S30.9 21.7 46.5 21.7c4.1 0 8 .8 11.5 2.3z' fill='%23F49B68'/%3E%3C/svg%3E" />

  <!-- Google Fonts: IBM Plex Sans Arabic (Fallback for Thmanyah Serif Display) & Amiri -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* =========================================================================
       ANEES DESIGN SYSTEM TOKENS (LIGHT & DARK MODES)
       ========================================================================= */
    :root {
      --bg-canvas: #F1EFEA;
      --bg-surface: #FFFFFF;
      --bg-surface-alt: #DFDDD7;

      --color-primary: #20211F;
      --color-primary-soft: #DFDDD7;
      --color-accent: #DF713B;
      --bg-accent-soft: #F3DFD1;

      --text-primary: #20211F;
      --text-secondary: #4A4A41;
      --text-on-primary: #FFFFFF;
      --text-on-accent: #20211F;

      --border-subtle: #D7D5CE;
      --shadow-card: 0px 4px 20px rgba(32, 33, 31, 0.04);

      --color-success: #426347;
      --bg-success-soft: #E4EBDF;
      --color-warning: #80551F;
      --bg-warning-soft: #F3E7D4;
      --color-error: #A33D36;
      --bg-error-soft: #F4E0DA;
      --color-info: #44617C;
      --bg-info-soft: #E1E8EF;

      --radius-card: 24px;
      --radius-control: 16px;
      --radius-pill: 999px;
      --control-height: 48px;
    }

    [data-theme="dark"] {
      --bg-canvas: #20211E;
      --bg-surface: #242622;
      --bg-surface-alt: #32352F;

      --color-primary: #F4F2EB;
      --color-primary-soft: #32352F;
      --color-accent: #F49B68;
      --bg-accent-soft: #443025;

      --text-primary: #F4F2EB;
      --text-secondary: #B8BAB0;
      --text-on-primary: #20211F;
      --text-on-accent: #20211F;

      --border-subtle: #41453D;
      --shadow-card: 0px 4px 20px rgba(0, 0, 0, 0.25);

      --color-success: #B1CAA1;
      --bg-success-soft: #2B3829;
      --color-warning: #E9C38A;
      --bg-warning-soft: #403524;
      --color-error: #F3AAA0;
      --bg-error-soft: #452B28;
      --color-info: #AFC9E0;
      --bg-info-soft: #293641;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: 'thmanyah serif display', 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      overscroll-behavior-y: contain;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .font-quran {
      font-family: 'Amiri', serif;
      line-height: 1.75;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 9999px;
    }

    /* Core Design System Utility Classes */
    .ds-canvas { background-color: var(--bg-canvas); }
    .ds-surface {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-card);
    }
    .ds-surface-alt {
      background-color: var(--bg-surface-alt);
      border: 1px solid var(--border-subtle);
    }
    .ds-text-primary { color: var(--text-primary); }
    .ds-text-secondary { color: var(--text-secondary); }
    .ds-border { border-color: var(--border-subtle); }

    .ds-btn-primary {
      background-color: var(--color-primary);
      color: var(--text-on-primary);
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .ds-btn-primary:hover:not(:disabled) {
      opacity: 0.92;
    }
    .ds-btn-primary:active:not(:disabled) {
      transform: scale(0.98);
    }
    .ds-btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .ds-btn-soft {
      background-color: var(--color-primary-soft);
      color: var(--text-primary);
      transition: all 0.2s ease;
    }
    .ds-btn-soft:active {
      transform: scale(0.98);
    }

    .ds-card-completed {
      background-color: var(--bg-success-soft);
      border-color: var(--color-success);
    }

    /* =========================================================================
       SPLASH SCREEN ANIMATIONS
       ========================================================================= */
    @keyframes logoEntrance {
      0% { opacity: 0; transform: scale(0.84) translateY(16px); }
      65% { opacity: 1; transform: scale(1.03) translateY(-2px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }
    @keyframes twinkleStar {
      0%, 100% { opacity: 0.04; transform: scale(1); }
      50% { opacity: 0.09; transform: scale(1.06); }
    }
    @keyframes rayPulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    .splash-logo-anim {
      animation: logoEntrance 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .splash-title-anim {
      opacity: 0;
      animation: fadeSlideUp 0.65s ease-out 0.35s forwards;
    }
    .splash-subtitle-anim {
      opacity: 0;
      animation: fadeSlideUp 0.65s ease-out 0.55s forwards;
    }
    .splash-footer-anim {
      opacity: 0;
      animation: fadeSlideUp 0.65s ease-out 0.75s forwards;
    }
    .bg-helal-anim {
      animation: gentleFloat 5s ease-in-out infinite;
    }
    .bg-star-anim {
      animation: twinkleStar 4s ease-in-out infinite;
    }
    .logo-rays {
      transform-origin: 28px 18px;
      animation: rayPulse 2.4s ease-in-out infinite;
    }

    /* Onboarding & View Transitions */
    @keyframes screenFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-screen {
      animation: screenFadeIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes slideUpSheet {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes slideDownSheet {
      from { transform: translateY(0); }
      to { transform: translateY(100%); }
    }
    .bottom-sheet-enter {
      animation: slideUpSheet 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .bottom-sheet-exit {
      animation: slideDownSheet 0.24s cubic-bezier(0.4, 0, 1, 1) forwards;
    }

    /* Custom Form Inputs & Select */
    .anees-input {
      width: 100%;
      height: 52px;
      padding: 0 20px;
      border-radius: 999px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 500;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .anees-input::placeholder {
      color: var(--text-secondary);
      opacity: 0.6;
    }
    .anees-input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-primary) 12%, transparent);
    }

    .anees-select-wrap {
      position: relative;
      width: 100%;
    }
    .anees-select {
      width: 100%;
      height: 52px;
      padding: 0 20px 0 44px;
      border-radius: 999px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 500;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }
    .anees-select:focus {
      outline: none;
      border-color: var(--color-primary);
    }
    .anees-select-chevron {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-primary);
    }

    /* Avatar Ring Selection */
    .avatar-btn {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .avatar-btn:active {
      transform: scale(0.93);
    }
    .avatar-btn.selected {
      box-shadow: 0 0 0 3px var(--bg-canvas), 0 0 0 5.5px var(--color-primary);
    }

    /* Scope & Pace Option Cards */
    .option-card {
      width: 100%;
      padding: 18px 20px;
      border-radius: 24px;
      background-color: var(--bg-surface);
      border: 1.5px solid var(--border-subtle);
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      text-align: right;
      transition: all 0.2s ease;
    }
    .option-card.selected {
      background-color: var(--bg-surface-alt);
      border-color: var(--color-primary);
    }
    .option-card.disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    .radio-circle {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1.5px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .option-card.selected .radio-circle {
      border-color: var(--color-primary);
    }
    .radio-dot {
      width: 11px;
      height: 11px;
      border-radius: 999px;
      background-color: var(--color-primary);
      transform: scale(0);
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .option-card.selected .radio-dot {
      transform: scale(1);
    }

    .pb-safe {
      padding-bottom: calc(6rem + env(safe-area-inset-bottom, 0px));
    }
    .bottom-nav-safe {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .onboarding-safe-bottom {
      padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
    }
  </style>
</head>
<body class="min-h-screen select-none">

  <!-- =========================================================================
       1. FULL-SCREEN ANIMATED SPLASH SCREEN
       ========================================================================= -->
  <div id="splashScreen" onclick="skipSplash()" class="fixed inset-0 z-[100] flex flex-col items-center justify-between overflow-hidden ds-canvas px-6 py-12 cursor-pointer transition-opacity duration-500">
    <!-- Decorative Background Stars (Top Left/Right) -->
    <div class="pointer-events-none absolute inset-0 overflow-hidden">
      <!-- Large Star -->
      <svg class="bg-star-anim absolute -top-4 left-2 w-44 h-44" style="color: var(--text-primary); opacity: 0.045;" viewBox="0 0 120 120" fill="currentColor">
        <path d="M60 6l15.2 33.4 36.6 4.4-27 25.1 7.1 36.1L60 87.2 28.1 105l7.1-36.1-27-25.1 36.6-4.4L60 6z" />
      </svg>
      <!-- Small Star -->
      <svg class="bg-star-anim absolute top-32 right-16 w-24 h-24" style="color: var(--text-primary); opacity: 0.04; animation-delay: 1.2s;" viewBox="0 0 120 120" fill="currentColor">
        <path d="M60 6l15.2 33.4 36.6 4.4-27 25.1 7.1 36.1L60 87.2 28.1 105l7.1-36.1-27-25.1 36.6-4.4L60 6z" />
      </svg>
      <!-- Crescent Moon (Bottom Left) -->
      <svg class="bg-helal-anim absolute -bottom-12 -left-12 w-80 h-80" viewBox="0 0 220 220" fill="none">
        <path d="M92 22C46 42 18 88 24 140c7 62 63 106 125 99 35-4 65-23 83-50-24 12-52 16-80 10-56-12-92-67-80-123 4-19 11-37 20-54z" fill="var(--color-accent)" fill-opacity="0.08" stroke="var(--text-primary)" stroke-opacity="0.06" stroke-width="3" />
      </svg>
    </div>

    <!-- Top Spacer -->
    <div class="h-6"></div>

    <!-- Center Brand Mark & Titles -->
    <div class="relative z-10 flex flex-col items-center text-center">
      <!-- Anees Illustrated Book Logo -->
      <div class="splash-logo-anim mb-5">
        <svg class="w-36 h-36" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Soft Warm Circle Backdrop -->
          <circle cx="66" cy="70" r="46" fill="var(--border-subtle)" fill-opacity="0.55" />
          <!-- Sparkle Rays Top Right (in RTL visual) -->
          <g class="logo-rays" stroke="#3E1E14" stroke-width="4.5" stroke-linecap="round">
            <line x1="36" y1="16" x2="36" y2="24" />
            <line x1="25" y1="22" x2="31" y2="28" />
            <line x1="20" y1="33" x2="28" y2="33" />
          </g>
          <!-- Small Floating Ring Bottom Left -->
          <circle cx="22" cy="104" r="6.5" stroke="#3E1E14" stroke-width="4" fill="none" />
          <!-- Small Floating Dot Right -->
          <circle cx="122" cy="54" r="3" fill="#3E1E14" />

          <!-- Book Spine (Terracotta) -->
          <path d="M40 33C40 28.5 43.5 25 48 25H54V115H48C43.5 115 40 111.5 40 107V33Z" fill="#DF6547" />
          <!-- Book Cover (Warm Gold) -->
          <rect x="53" y="25" width="58" height="90" rx="2" fill="#F8C846" />
          <!-- Bottom Pages Strip -->
          <path d="M40 112C40 107.5 43.5 104 48 104H111V118H48C43.5 118 40 115 40 112Z" fill="#FFFFFF" />
          <!-- Book Outer & Inner Borders -->
          <path d="M48 25H111V118H48C43.5817 118 40 114.418 40 110V33C40 28.5817 43.5817 25 48 25Z" stroke="#3E1E14" stroke-width="4.5" stroke-linejoin="round" />
          <line x1="53" y1="25" x2="53" y2="104" stroke="#3E1E14" stroke-width="4.5" />
          <path d="M40 111C40 107.134 43.134 104 47 104H111" stroke="#3E1E14" stroke-width="4.5" />
          <line x1="47" y1="111" x2="76" y2="111" stroke="#3E1E14" stroke-width="4" stroke-linecap="round" />

          <!-- Crescent Moon on Cover -->
          <path d="M84 44C74.5 46.5 68 55 68 65C68 77 77.7 86.7 89.7 86.7C94.5 86.7 99 85.1 102.6 82.4C99.8 83.2 96.8 83.6 93.7 83.6C81.7 83.6 72 73.9 72 61.9C72 54.4 75.8 47.8 81.6 43.9L84 44Z" fill="#F58220" stroke="#3E1E14" stroke-width="4" stroke-linejoin="round" />
          <!-- Star next to Crescent -->
          <path d="M97 44L99.2 49.2L104.8 49.7L100.5 53.4L101.8 58.9L97 56L92.2 58.9L93.5 53.4L89.2 49.7L94.8 49.2L97 44Z" fill="#3E1E14" />

          <!-- Decorative Lines Below Crescent -->
          <line x1="68" y1="95" x2="96" y2="95" stroke="#7A6A73" stroke-width="4" stroke-linecap="round" />
          <line x1="75" y1="101" x2="89" y2="101" stroke="#7A6A73" stroke-width="4" stroke-linecap="round" />
        </svg>
      </div>

      <!-- Brand Title & Tagline -->
      <h1 class="splash-title-anim text-4xl font-bold tracking-tight ds-text-primary mb-2">
        آنيس
      </h1>
      <p class="splash-subtitle-anim text-base font-medium ds-text-secondary">
        أُنسُك اليومي بالقرآن
      </p>
    </div>

    <!-- Bottom App Version -->
    <div class="splash-footer-anim relative z-10 text-center">
      <span class="text-sm font-medium ds-text-secondary tracking-wide">App v1.0</span>
    </div>
  </div>

  <!-- =========================================================================
       2. MULTI-STEP ONBOARDING FLOW CONTAINER
       ========================================================================= -->
  <div id="onboardingContainer" class="hidden max-w-lg mx-auto min-h-screen flex-col justify-between ds-canvas px-5 pt-7 onboarding-safe-bottom">
    <!-- Dynamic Onboarding Step Content Injected Here -->
    <div id="onboardingStepContent" class="flex-1 flex flex-col"></div>
  </div>

  <!-- =========================================================================
       3. MAIN APPLICATION CONTAINER (DASHBOARD, LIBRARY, SETTINGS)
       ========================================================================= -->
  <div id="mainAppContainer" class="hidden max-w-lg mx-auto min-h-screen flex-col relative ds-canvas">

    <!-- Top App Header -->
    <header id="mainHeader" class="sticky top-0 z-30 px-4 pt-4 pb-3 backdrop-blur-md border-b ds-border" style="background-color: color-mix(in srgb, var(--bg-canvas) 92%, transparent);">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-3">
          <div id="headerUserAvatar" class="w-11 h-11 rounded-full flex items-center justify-center shrink-0 overflow-hidden border ds-border">
            <!-- User Avatar Rendered Dynamically -->
          </div>
          <div>
            <h1 id="headerGreetingTitle" class="text-base font-bold tracking-tight ds-text-primary flex items-center gap-1.5">
              أهلاً بك في آنيس
            </h1>
            <p id="headerDateBadge" class="text-xs ds-text-secondary font-medium mt-0.5 tabular-nums"></p>
          </div>
        </div>

        <!-- Quick Share & Theme Switcher -->
        <div class="flex items-center gap-2">
          <button onclick="shareTodayAchievement()" title="مشاركة إنجاز اليوم" class="p-2.5 rounded-2xl ds-surface ds-text-primary active:scale-95 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
            </svg>
          </button>
          <button onclick="toggleTheme()" title="تبديل المظهر الليلي/النهاري" class="p-2.5 rounded-2xl ds-surface ds-text-primary active:scale-95 transition">
            <svg id="themeIconSun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <svg id="themeIconMoon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Dynamic Content -->
    <main id="appContent" class="flex-1 px-4 pt-4 pb-safe space-y-4">
      <!-- Views injected via JS -->
    </main>

    <!-- Floating Action Button (FAB) for Adding Hifz -->
    <div id="fabContainer" class="fixed bottom-20 left-0 right-0 z-30 max-w-lg mx-auto pointer-events-none px-4 flex justify-start">
      <button onclick="openAddModal()" aria-label="إضافة محفوظ جديد" title="إضافة محفوظ جديد أو قديم" class="pointer-events-auto w-14 h-14 rounded-full ds-btn-primary shadow-xl flex items-center justify-center active:scale-90 transition-transform">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
      </button>
    </div>

    <!-- Bottom Mobile Navigation (3 Tabs) -->
    <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 z-40 max-w-lg mx-auto border-t ds-border bottom-nav-safe backdrop-blur-md" style="background-color: color-mix(in srgb, var(--bg-surface) 95%, transparent);">
      <div class="grid grid-cols-3 h-16">
        <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center justify-center gap-1 transition" style="color: var(--color-primary);">

    function getLocalTodayISO() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      const local = new Date(now.getTime() - offset * 60000);
      return local.toISOString().split('T')[0];
    }

    function getFormattedDates() {
      const now = new Date();
      let hijri = '';
      try {
        hijri = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {
          day: 'numeric', month: 'long', year: 'numeric'
        }).format(now);
      } catch (e) { hijri = ''; }

      const gregorian = new Intl.DateTimeFormat('ar-EG', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      }).format(now);

      return { hijri, gregorian };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('murajie_quran_v3');
        if (!raw) return JSON.parse(JSON.stringify(defaultState));
        const parsed = JSON.parse(raw);
        // Migrate existing users seamlessly if they already had items saved
        if (parsed.items && parsed.items.length > 0 && parsed.onboardingCompleted === undefined) {
          parsed.onboardingCompleted = true;
        }
        return {
          ...JSON.parse(JSON.stringify(defaultState)),
          ...parsed,
          userProfile: { ...defaultState.userProfile, ...(parsed.userProfile || {}) }
        };
      } catch (e) {
        return JSON.parse(JSON.stringify(defaultState));
      }
    }

    function saveState() {
      try {
        sortItemsInMushafOrder();
        recordTodaySnapshot();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        updateBadges();
      } catch (e) {
        showToast('تعذر حفظ البيانات محلياً', 'error');
      }
    }

    function sortItemsInMushafOrder() {
      const currentTargetId = state.items[state.pointerIndex]?.id;
      state.items.sort((a, b) => {
        if (a.surahId !== b.surahId) return a.surahId - b.surahId;
        return a.rubOrder - b.rubOrder;
      });
      if (state.items.length === 0) {
        state.pointerIndex = 0;
      } else if (currentTargetId) {
        const idx = state.items.findIndex(i => i.id === currentTargetId);
        state.pointerIndex = idx !== -1 ? idx : (state.pointerIndex % state.items.length);
      } else {
        state.pointerIndex = state.pointerIndex % state.items.length;
      }
    }

    function getNearPastItems() {
      const limit = state.dailyNearLimit ?? 4;
      if (state.items.length === 0 || limit <= 0) return [];
      const validRecent = state.recentAddedIds
        .map(id => state.items.find(it => it.id === id))
        .filter(Boolean);

      if (validRecent.length >= limit) {
        return validRecent.slice(0, limit);
      }
      const sortedByRecent = [...state.items].sort((a, b) => b.addedAt - a.addedAt);
      return sortedByRecent.slice(0, Math.min(limit, sortedByRecent.length));
    }

    function syncDailySession() {
      const todayISO = getLocalTodayISO();
      sortItemsInMushafOrder();

      state.todaySession.farTasks = (state.todaySession.farTasks || []).filter(t =>
        state.items.some(it => it.id === t.itemId)
      );
      state.todaySession.nearDoneIds = (state.todaySession.nearDoneIds || []).filter(id =>
        state.items.some(it => it.id === id)
      );

      if (state.todaySession.date === todayISO) {
        if (state.items.length > 0 && state.todaySession.farTasks.length === 0 && state.dailyFarLimit > 0) {
          populateFarTasksForToday([]);
          saveState();
        }
        return;
      }

      if (state.todaySession.date) {
        recordSnapshotForDate(state.todaySession.date);
      }

      const uncompletedFromYesterday = (state.todaySession.farTasks || [])
        .filter(t => !t.done && state.items.some(it => it.id === t.itemId))
        .map(t => ({ itemId: t.itemId, done: false, carriedOver: true }));

      state.todaySession = {
        date: todayISO,
        farTasks: [],
        nearDoneIds: [],
        carriedOverCount: uncompletedFromYesterday.length
      };

      if (state.items.length > 0) {
        populateFarTasksForToday(uncompletedFromYesterday);
      }

      saveState();

      if (state.onboardingCompleted && uncompletedFromYesterday.length > 0) {
        setTimeout(() => {
          showToast(`تم ترحيل ${uncompletedFromYesterday.length} ${uncompletedFromYesterday.length === 1 ? 'ربع' : 'أرباع'} متبقية من الأمس لورد اليوم`, 'warning');
        }, 450);
      }
    }

    function populateFarTasksForToday(carriedTasks) {
      const total = state.items.length;
      if (total === 0) return;

      const tasks = [...carriedTasks];
      const existingIds = new Set(tasks.map(t => t.itemId));
      const targetCount = Math.min(state.dailyFarLimit, total);

      let safety = 0;
      while (tasks.length < targetCount && safety < total) {
        const candidate = state.items[state.pointerIndex % total];
        state.pointerIndex = (state.pointerIndex + 1) % total;
        if (!existingIds.has(candidate.id)) {
          tasks.push({ itemId: candidate.id, done: false, carriedOver: false });
          existingIds.add(candidate.id);
        }
        safety++;
      }

      state.todaySession.farTasks = tasks;
    }

    function addExtraRubToToday() {
      const total = state.items.length;
      if (total === 0) return;

      const currentIds = new Set(state.todaySession.farTasks.map(t => t.itemId));
      if (currentIds.size >= total) {
        showToast('لقد أضفت جميع أرباع محفوظك في قائمة اليوم ما شاء الله!', 'warning');
        return;
      }

      let addedItem = null;
      let safety = 0;
      while (safety < total) {
        const candidate = state.items[state.pointerIndex % total];
        state.pointerIndex = (state.pointerIndex + 1) % total;
        if (!currentIds.has(candidate.id)) {
          state.todaySession.farTasks.push({
            itemId: candidate.id,
            done: false,
            carriedOver: false,
            isExtra: true
          });
          addedItem = candidate;
          break;
        }
        safety++;
      }

      saveState();
      renderAll();
      if (addedItem) {
        showToast(`تمت إضافة ربع إضافي من سورة ${addedItem.surahName} لورد اليوم`);
      }
    }

    function toggleFarTaskDone(itemId) {
      const task = state.todaySession.farTasks.find(t => t.itemId === itemId);
      if (!task) return;

      task.done = !task.done;
      if (task.done) {
        state.cycleReviewedCount += 1;
        if (state.items.length > 0 && state.cycleReviewedCount >= state.items.length) {
          state.cycleReviewedCount = 0;
          state.completedCycles += 1;
          showToast(`مبارك! أتممت دورة مراجعة كاملة (${state.completedCycles})`, 'success');
        }
      } else {
        state.cycleReviewedCount = Math.max(0, state.cycleReviewedCount - 1);
      }

      saveState();
      renderAll();
    }

    function toggleNearTaskDone(itemId) {
      const idx = state.todaySession.nearDoneIds.indexOf(itemId);
      if (idx === -1) {
        state.todaySession.nearDoneIds.push(itemId);
      } else {
        state.todaySession.nearDoneIds.splice(idx, 1);
      }
      saveState();
      renderAll();
    }

    function recordTodaySnapshot() {
      recordSnapshotForDate(getLocalTodayISO());
    }

    function recordSnapshotForDate(dateISO) {
      if (!dateISO) return;
      const nearItems = getNearPastItems();
      const farTasks = state.todaySession.farTasks || [];
      const nearDoneCount = nearItems.filter(it => (state.todaySession.nearDoneIds || []).includes(it.id)).length;
      const farDoneCount = farTasks.filter(t => t.done).length;

      state.historyLogs[dateISO] = {
        totalTasks: nearItems.length + farTasks.length,
        completedTasks: nearDoneCount + farDoneCount,
        farDone: farDoneCount,
        farTotal: farTasks.length,
        nearDone: nearDoneCount,
        nearTotal: nearItems.length
      };
    }

    let splashTimeoutId = null;

    function startAppFlow() {
      applyTheme();
      syncDailySession();
      updateBadges();
      initBottomSheetGestures();

      const duration = state.onboardingCompleted ? 1400 : 2800;
      splashTimeoutId = setTimeout(finishSplash, duration);
    }

    function skipSplash() {
      if (splashTimeoutId) clearTimeout(splashTimeoutId);
      finishSplash();
    }

    function finishSplash() {
      const splash = document.getElementById('splashScreen');
      if (!splash || splash.classList.contains('hidden')) return;

      splash.style.opacity = '0';
      setTimeout(() => {
        splash.classList.add('hidden');
        if (state.onboardingCompleted) {
          enterMainApp();
        } else {
          enterOnboarding();
        }
      }, 420);
    }

      document.getElementById('mainAppContainer').classList.add('hidden');
      document.getElementById('mainAppContainer').classList.remove('flex');
      const ob = document.getElementById('onboardingContainer');
      ob.classList.remove('hidden');
      ob.classList.add('flex');
      obStep = 1;
      renderOnboardingStep();
    }

    function enterMainApp() {
      document.getElementById('onboardingContainer').classList.add('hidden');
      document.getElementById('onboardingContainer').classList.remove('flex');
      const main = document.getElementById('mainAppContainer');
      main.classList.remove('hidden');
      main.classList.add('flex');
      updateHeaderIdentity();
      switchTab('home');

      const avatarEl = document.getElementById('headerUserAvatar');

      // STEP 2: Memorization Scope Selection
      if (obStep === 2) {

        container.innerHTML = `

            </div>

      // STEP 4A: Full Quran Daily Pace Selection
      if (obStep === 4 && obScope === 'full') {

        const cycleDays = obCustomFar > 0 ? Math.max(1, Math.ceil(estimatedTotalRubs / obCustomFar)) : 0;

        let juzEquivalentText = '';
        if (totalDailyRubs === 8) juzEquivalentText = ' (جزء واحد)';

      if (letterInner) {

      state.userProfile.avatarId = id;
      renderOnboardingStep();

      obStep = step;
      renderOnboardingStep();
    }

    function selectObScope(scope) {
      obScope = scope;
      renderOnboardingStep();
    }

    function handleObStep2Next() {
      if (obScope === 'full') {
        obStep = 4;
      } else if (obScope === 'partial') {
        obStep = 3;
      }
      renderOnboardingStep();
    }

    function setObHifzTab(tab) {
      obHifzTab = tab;
      renderOnboardingStep();
    }

    function handleObAddJuz(juzId) {
      const juz = JUZ_LIST.find(j => j.id === Number(juzId));
      if (!juz) return;
      if (obChips.some(c => c.type === 'juz' && c.juzId === juz.id)) {
        showToast(`${juz.name} مضاف بالفعل`, 'warning');
        return;
      }
      obChips.push({ uid: `juz_${juz.id}`, type: 'juz', label: juz.name, juzId: juz.id });
      renderOnboardingStep();
    }

    function handleObAddSurah(surahId) {
      const surah = QURAN_DATA.find(s => s.id === Number(surahId));
      if (!surah) return;
      if (obChips.some(c => c.type === 'surah' && c.surahId === surah.id)) {
        showToast(`سورة ${surah.name} مضافة بالفعل`, 'warning');
        return;
      }
      obChips.push({ uid: `surah_${surah.id}`, type: 'surah', label: `سورة ${surah.name}`, surahId: surah.id });
      renderOnboardingStep();
    }

    function handleObSelectSurahForRub(surahId) {
      obSelectedSurahForRub = surahId;
      renderOnboardingStep();
    }

    function handleObAddUptoRub(uptoRub) {
      const surah = QURAN_DATA.find(s => s.id === Number(obSelectedSurahForRub));
      const rubIdx = Number(uptoRub);
      if (!surah || !rubIdx) return;

      const existingIdx = obChips.findIndex(c => (c.type === 'rub' || c.type === 'surah') && c.surahId === surah.id);
      const chipObj = {
        uid: `rub_${surah.id}_${rubIdx}`,
        type: 'rub',
        label: `سورة ${surah.name} (حتى الربع ${rubIdx})`,
        surahId: surah.id,
        uptoRub: rubIdx
      };
      if (existingIdx !== -1) {
        obChips[existingIdx] = chipObj;
      } else {
        obChips.push(chipObj);
      }
      obSelectedSurahForRub = '';
      renderOnboardingStep();
    }

    function removeObChip(uid) {
      obChips = obChips.filter(c => c.uid !== uid);
      renderOnboardingStep();
    }

    function selectObFullPace(rubs) {
      obFullPace = rubs;
      renderOnboardingStep();
    }

    function adjustObWird(type, delta) {
      if (type === 'near') {
        obCustomNear = Math.max(0, Math.min(20, obCustomNear + delta));
      } else {
        obCustomFar = Math.max(0, Math.min(30, obCustomFar + delta));
      }
      renderOnboardingStep();
    }

    function calculateEstimatedObRubs() {
      const uniqueRubKeys = new Set();
      obChips.forEach(chip => {
        if (chip.type === 'juz') {
          const juz = JUZ_LIST.find(j => j.id === chip.juzId);
          if (juz) {
            juz.surahs.forEach(entry => {
              for (let r = 1; r <= entry.upto; r++) uniqueRubKeys.add(`${entry.id}_${r}`);
            });
          }
        } else if (chip.type === 'surah') {
          const surah = QURAN_DATA.find(s => s.id === chip.surahId);
          if (surah) {
            for (let r = 1; r <= surah.rubList.length; r++) uniqueRubKeys.add(`${surah.id}_${r}`);
          }
        } else if (chip.type === 'rub') {
          for (let r = 1; r <= chip.uptoRub; r++) uniqueRubKeys.add(`${chip.surahId}_${r}`);
        }
      });
      return Math.max(1, uniqueRubKeys.size);
    }

    function completeOnboardingFlow() {
      state.items = [];
      state.recentAddedIds = [];
      state.pointerIndex = 0;
      state.cycleReviewedCount = 0;

      if (obScope === 'full') {
        // Populate all 114 Surahs (Full Quran)
        QURAN_DATA.forEach(s => addFullSurah(s.id, true));
        state.dailyNearLimit = 0;
        state.dailyFarLimit = obFullPace || 8;
      } else {
        // Populate Selected Chips
        obChips.forEach(chip => {
          if (chip.type === 'juz') {
            const juz = JUZ_LIST.find(j => j.id === chip.juzId);
            if (juz) {
              juz.surahs.forEach(entry => addUpToRub(entry.id, entry.upto, true));
            }
          } else if (chip.type === 'surah') {
            addFullSurah(chip.surahId, true);
          } else if (chip.type === 'rub') {
            addUpToRub(chip.surahId, chip.uptoRub, true);
          }
        });
        state.dailyNearLimit = obCustomNear;
        state.dailyFarLimit = obCustomFar;
      }

      sortItemsInMushafOrder();
      state.todaySession = {
        date: getLocalTodayISO(),
        farTasks: [],
        nearDoneIds: [],
        carriedOverCount: 0
      };
      populateFarTasksForToday([]);
      state.onboardingCompleted = true;
      saveState();

      enterMainApp();
      showToast(`أهلاً بك يا ${state.userProfile.name}، تم تجهيز خطة وردك بنجاح`, 'success');
    }

    function initBottomSheetGestures() {
      const handle = document.getElementById('sheetDragHandle');
      const panel = document.getElementById('addHifzSheetPanel');
      if (!handle || !panel) return;

      let startY = 0;
      let currentY = 0;
      let isDragging = false;

      handle.addEventListener('touchstart', (e) => {
        startY = e.touches[0].clientY;
        isDragging = true;
        panel.style.transition = 'none';
      }, { passive: true });

      handle.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        currentY = e.touches[0].clientY - startY;
        if (currentY > 0) panel.style.transform = `translateY(${currentY}px)`;
      }, { passive: true });

      handle.addEventListener('touchend', () => {
        if (!isDragging) return;
        isDragging = false;
        panel.style.transition = 'transform 0.22s ease';
        if (currentY > 90) closeAddModal();
        else panel.style.transform = 'translateY(0)';
        currentY = 0;
      });
    }

      if (state.darkMode) {

        if (moon) moon.classList.remove('hidden');
        if (metaTheme) metaTheme.setAttribute('content', '#F1EFEA');

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');

      let bgStyle = 'background-color: var(--bg-surface); color: var(--text-primary); border: 1px solid var(--border-subtle);';
      if (type === 'success') {
        bgStyle = 'background-color: var(--bg-success-soft); color: var(--color-success); border: 1px solid var(--color-success);';
      } else if (type === 'warning') {
        bgStyle = 'background-color: var(--bg-warning-soft); color: var(--color-warning); border: 1px solid var(--color-warning);';
      } else if (type === 'error') {
        bgStyle = 'background-color: var(--bg-error-soft); color: var(--color-error); border: 1px solid var(--color-error);';
      }

      toast.style.cssText = bgStyle;
      toast.className = 'px-4 py-3 rounded-2xl shadow-lg text-xs font-bold flex items-center justify-center text-center animate-screen w-full';
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-6px)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 250);

    /**
     * =========================================================================
     * 8. ADDING HIFZ & LIBRARY MANAGEMENT
     * =========================================================================
     */
    function registerNewlyAddedIds(newIds) {
      const combined = [...newIds.reverse(), ...state.recentAddedIds];
      state.recentAddedIds = [...new Set(combined)].slice(0, 25);
    }

    function addFullSurah(surahId, silent = false) {
      const surah = QURAN_DATA.find(s => s.id === Number(surahId));
      if (!surah) return 0;

      const addedIds = [];
      surah.rubList.forEach((rubTitle, index) => {
        const exists = state.items.some(item => item.surahId === surah.id && item.rubOrder === index + 1);
        if (!exists) {
          const newId = `s${surah.id}_r${index + 1}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
          state.items.push({
            id: newId,
            surahId: surah.id,
            surahName: surah.name,
            rubOrder: index + 1,
            mushafRubNum: Math.min(240, surah.startRub + index),
            title: rubTitle,
            addedAt: Date.now() + index
          });
          addedIds.push(newId);
        }
      });

      if (addedIds.length > 0) {
        registerNewlyAddedIds(addedIds);
        if (state.todaySession.farTasks.length === 0 && state.dailyFarLimit > 0) {
          sortItemsInMushafOrder();
          populateFarTasksForToday([]);
        }
        saveState();
        if (!silent) {
          closeAddModal();
          renderAll();
          showToast(`تمت إضافة سورة ${surah.name} (${addedIds.length} ${addedIds.length === 1 ? 'ربع' : 'أرباع'}) بنجاح`, 'success');
        }
      } else if (!silent) {
        showToast(`سورة ${surah.name} مضافة بالكامل مسبقاً`, 'warning');
      }
      return addedIds.length;
    }

    function addUpToRub(surahId, maxRubOrder, silent = false) {
      const surah = QURAN_DATA.find(s => s.id === Number(surahId));
      if (!surah) return 0;

      const addedIds = [];
      for (let i = 0; i < maxRubOrder; i++) {
        const rubTitle = surah.rubList[i];
        const exists = state.items.some(item => item.surahId === surah.id && item.rubOrder === i + 1);
        if (!exists) {
          const newId = `s${surah.id}_r${i + 1}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
          state.items.push({
            id: newId,
            surahId: surah.id,
            surahName: surah.name,
            rubOrder: i + 1,
            mushafRubNum: Math.min(240, surah.startRub + i),
            title: rubTitle,
            addedAt: Date.now() + i
          });
          addedIds.push(newId);
        }
      }

      if (addedIds.length > 0) {
        registerNewlyAddedIds(addedIds);
        if (state.todaySession.farTasks.length === 0 && state.dailyFarLimit > 0) {
          sortItemsInMushafOrder();
          populateFarTasksForToday([]);
        }
        saveState();
        if (!silent) {
          closeAddModal();
          renderAll();
          showToast(`تمت إضافة ${addedIds.length} أرباع من سورة ${surah.name} بنجاح`, 'success');
        }
      } else if (!silent) {
        showToast('هذه الأرباع مضافة مسبقاً في قائمتك', 'warning');
      }
      return addedIds.length;
    }

    function addSingleOrCustomRub(surahId, rubOrder, customTitle) {
      const surah = QURAN_DATA.find(s => s.id === Number(surahId));
      if (!surah) return;

      const order = Number(rubOrder) || (surah.rubList.length + 1);
      const defaultTitle = surah.rubList[order - 1] || `ربع مخصص (${order})`;
      const finalTitle = (customTitle && customTitle.trim().length > 0) ? customTitle.trim() : defaultTitle;
      const newId = `s${surah.id}_r${order}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;

      state.items.push({
        id: newId,
        surahId: surah.id,
        surahName: surah.name,
        rubOrder: order,
        mushafRubNum: Math.min(240, surah.startRub + order - 1),
        title: finalTitle,
        addedAt: Date.now()
      });

      registerNewlyAddedIds([newId]);
      if (state.todaySession.farTasks.length === 0 && state.dailyFarLimit > 0) {
        sortItemsInMushafOrder();
        populateFarTasksForToday([]);
      }
      saveState();
      closeAddModal();
      renderAll();
      showToast(`تمت إضافة الربع إلى سورة ${surah.name} وتحديث الماضي القريب`, 'success');
    }

    /**
     * =========================================================================
     * 9. DASHBOARD ANALYTICS & ENCOURAGEMENT LOGIC
     * =========================================================================
     */
    function calculateStreak() {
      let streak = 0;
      const now = new Date();
      for (let i = 0; i < 60; i++) {
        const d = new Date(now.getTime() - i * 86400000);
        const offset = d.getTimezoneOffset();
        const iso = new Date(d.getTime() - offset * 60000).toISOString().split('T')[0];
        const log = state.historyLogs[iso];
        if (log && log.completedTasks > 0) streak++;
        else if (i > 0) break;
      }
      return streak;
    }

    function getYesterdayAnalysis() {
      const now = new Date();
      const yest = new Date(now.getTime() - 86400000);
      const offset = yest.getTimezoneOffset();
      const yestISO = new Date(yest.getTime() - offset * 60000).toISOString().split('T')[0];
      const yLog = state.historyLogs[yestISO];

      if (!yLog || yLog.totalTasks === 0) {
        return {
          status: 'neutral',
          title: 'بداية متجددة مع كتاب الله',
          message: 'اجعل لك اليوم ورداً ثابتاً ولو يسيراً؛ فأحب الأعمال إلى الله أدومها وإن قل.'
        };
      }

      const pct = Math.round((yLog.completedTasks / yLog.totalTasks) * 100);
      if (pct >= 100) {
        return {
          status: 'success',
          title: 'همة الأمس كانت عالية ما شاء الله!',
          message: `أتممت بالأمس (${yLog.completedTasks} من ${yLog.totalTasks}) من وردك كاملاً. حافظ على هذا الثبات اليوم أيضاً!`
        };
      } else if (pct >= 50) {
        return {
          status: 'warning',
          title: 'خطوة طيبة بالأمس، واليوم أكمل',
          message: `أنجزت بالأمس ${pct}% من وردك (${yLog.completedTasks} من ${yLog.totalTasks})، وقد رحّلنا لك المتبقي لتتمه بهمة اليوم.`
        };
      } else {
        return {
          status: 'error',
          title: 'رسالة تشجيع: لا تستسلم للفتور',
          message: `كان إنجاز الأمس ضعيفاً (${yLog.completedTasks} من ${yLog.totalTasks})، لا بأس! استعن بالله وابدأ الآن بربع واحد فقط وسينفتح لك الباب.`
        };
      }
    }

    function getLast7DaysChartData() {
      const days = [];
      const dayNames = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
      const now = new Date();

      for (let i = 6; i >= 0; i--) {
        const d = new Date(now.getTime() - i * 86400000);
        const offset = d.getTimezoneOffset();
        const iso = new Date(d.getTime() - offset * 60000).toISOString().split('T')[0];
        const log = state.historyLogs[iso];
        const pct = (log && log.totalTasks > 0) ? Math.min(100, Math.round((log.completedTasks / log.totalTasks) * 100)) : 0;
        days.push({
          iso,
          label: i === 0 ? 'اليوم' : dayNames[d.getDay()],
          pct
        });
      }
      return days;
    }

    function getTodaySummaryData() {
      const nearItems = getNearPastItems();
      const farTasks = state.todaySession.farTasks || [];
      const nearDoneCount = nearItems.filter(it => state.todaySession.nearDoneIds.includes(it.id)).length;
      const farDoneCount = farTasks.filter(t => t.done).length;
      const totalToday = nearItems.length + farTasks.length;
      const doneToday = nearDoneCount + farDoneCount;
      const todayPct = totalToday > 0 ? Math.round((doneToday / totalToday) * 100) : 0;

      const surahNamesSet = new Set();
      nearItems.forEach(it => surahNamesSet.add(it.surahName));
      farTasks.forEach(t => {
        const it = state.items.find(x => x.id === t.itemId);
        if (it) surahNamesSet.add(it.surahName);
      });

      return {
        nearItems,
        farTasks,
        nearDoneCount,
        farDoneCount,
        totalToday,
        doneToday,
        todayPct,
        surahNames: Array.from(surahNamesSet)
      };
    }

    /**
     * =========================================================================
     * 10. SHARING & BACKUP
     * =========================================================================
     */
    function copyTextFallback(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('تم النسخ إلى الحافظة بنجاح', 'success');
      } catch (e) {
        showToast('تعذر النسخ تلقائياً', 'error');
      }
      document.body.removeChild(textarea);
    }

    function shareTodayAchievement() {
      const { hijri, gregorian } = getFormattedDates();
      const summary = getTodaySummaryData();
      const farDoneTasks = summary.farTasks.filter(t => t.done);
      const userName = (state.userProfile.name || '').trim();

      let msg = `تقرير المراجعة اليومية - آنيس${userName ? ' (' + userName + ')' : ''}
`;
      msg += `${hijri ? hijri + ' | ' : ''}${gregorian}

`;
      msg += `• الماضي القريب (تسميع): ${summary.nearDoneCount} من ${summary.nearItems.length}
`;
      msg += `• الماضي البعيد (مراجعة): ${summary.farDoneCount} من ${summary.farTasks.length}

`;

      if (farDoneTasks.length > 0) {
        msg += `الأرباع التي تمت مراجعتها اليوم:
`;
        farDoneTasks.forEach((t, i) => {
          const item = state.items.find(it => it.id === t.itemId);
          if (item) msg += `${i + 1}. سورة ${item.surahName}: ${item.title}
`;
        });
      }

      msg += `
إجمالي المحفوظ: ${state.items.length} ربع | ختمات المراجعة: ${state.completedCycles}`;

      if (navigator.share) {
        navigator.share({ title: 'ورد المراجعة اليومي - آنيس', text: msg }).catch(() => {});
      } else {
        copyTextFallback(msg);
      }
    }

    function openImportBackupModal() {
      openModal({
        title: 'استعادة نسخة احتياطية',

            </div>
            <button onclick="addFullSurah(${surah.id})" class="w-full h-12 rounded-full ds-btn-primary font-bold text-sm">
              إضافة سورة ${surah.name} كاملة
            </button>
          `;
        } else if (addMode === 'upto') {
          const rubOptions = surah.rubList.map((r, idx) => `<option value="${idx + 1}">${r}</option>`).join('');
          dynamicContainer.innerHTML = `
            <div>
              <label class="block text-xs font-bold ds-text-primary mb-1.5">حفظت من بداية السورة حتى نهاية:</label>
              <div class="anees-select-wrap">
                <select id="uptoRubSelect" class="anees-select text-xs">${rubOptions}</select>
                <svg class="anees-select-chevron w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
              </div>
            </div>
            <button onclick="addUpToRub(${surah.id}, Number(document.getElementById('uptoRubSelect').value))" class="w-full h-12 rounded-full ds-btn-primary font-bold text-sm">
              إضافة الأرباع المحددة
            </button>
          `;
        } else if (addMode === 'single') {
          const rubOptions = surah.rubList.map((r, idx) => `<option value="${idx + 1}">${r}</option>`).join('');
          dynamicContainer.innerHTML = `
            <div>
              <label class="block text-xs font-bold ds-text-primary mb-1.5">اختر الربع من السورة</label>
              <div class="anees-select-wrap">
                <select id="singleRubSelect" class="anees-select text-xs">${rubOptions}</select>
                <svg class="anees-select-chevron w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold ds-text-primary mb-1.5">اسم مخصص للربع (اختياري)</label>
              <input id="customRubTitleInput" type="text" placeholder="اتركه فارغاً لاستخدام بداية الربع التلقائية" class="anees-input text-xs" />
            </div>
            <button onclick="addSingleOrCustomRub(${surah.id}, document.getElementById('singleRubSelect').value, document.getElementById('customRubTitleInput').value)" class="w-full h-12 rounded-full ds-btn-primary font-bold text-sm">
              إضافة الربع للقائمة
            </button>
          `;
        }
      };

      surahSelect.addEventListener('change', updateDynamicFields);
      updateDynamicFields();
    }

    function setAddMode(mode) {
      addMode = mode;
      renderAddModalBody();
    }

    function renderLibraryView() {
      if (state.items.length === 0) {
        return `
          <div class="ds-surface rounded-3xl p-7 text-center mt-2 animate-screen">
            <p class="text-sm ds-text-secondary mb-4">لا توجد أرباع محفوظة في سجلك بعد.</p>
            <button onclick="openAddModal()" class="w-full h-12 px-5 rounded-full ds-btn-primary text-xs font-bold">
              + إضافة محفوظات الآن
            </button>
          </div>
        `;
      }

      const nextPointerId = state.items[state.pointerIndex]?.id;
      const groups = [];
      state.items.forEach(item => {
        let group = groups.find(g => g.surahId === item.surahId);
        if (!group) {
          group = { surahId: item.surahId, surahName: item.surahName, items: [] };
          groups.push(group);
        }
        group.items.push(item);
      });

      const filteredGroups = librarySearch.trim()
        ? groups.filter(g => g.surahName.includes(librarySearch.trim()))
        : groups;

      return `
        <div class="space-y-3 animate-screen">
          <div class="ds-surface rounded-full px-4 py-2.5 flex items-center gap-2">
            <svg class="w-4 h-4 ds-text-secondary shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input
              type="text"
              value="${librarySearch}"
              oninput="librarySearch = this.value; renderApp();"
              placeholder="ابحث باسم السورة..."
              class="w-full bg-transparent text-xs font-semibold focus:outline-none ds-text-primary"
            />
            <span class="shrink-0 text-[11px] font-bold px-2.5 py-1 rounded-full tabular-nums" style="background-color: var(--bg-accent-soft); color: var(--color-accent);">
              ${state.items.length} ربع
            </span>
          </div>

          <p class="text-[11px] ds-text-secondary px-1">
            اضغط على <strong>"ابدأ من هنا"</strong> بجانب أي ربع لتجعل ورد المراجعة القادم يبدأ من عنده.
          </p>

          ${filteredGroups.map(group => `
            <div class="ds-surface rounded-3xl overflow-hidden">
              <div class="px-4 py-3 ds-surface-alt border-b ds-border flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="w-7 h-7 rounded-full text-xs font-bold flex items-center justify-center tabular-nums" style="background-color: var(--color-primary); color: var(--text-on-primary);">
                    ${group.surahId}
                  </span>
                  <h3 class="text-sm font-bold ds-text-primary">سورة ${group.surahName}</h3>
                  <span class="text-[11px] ds-text-secondary tabular-nums">(${group.items.length})</span>
                </div>
                <button onclick="deleteSurahGroup(${group.surahId}, '${group.surahName}')" class="text-[11px] font-semibold hover:underline" style="color: var(--color-error);">
                  حذف السورة
                </button>
              </div>

              <div class="divide-y ds-border">
                ${group.items.map(item => {
                  const isNext = item.id === nextPointerId;
                  return `
                    <div class="p-3.5 flex items-center justify-between gap-2" style="${isNext ? 'background-color: var(--bg-accent-soft);' : ''}">
                      <div class="min-w-0 flex-1">
                        ${isNext ? `<span class="inline-block text-[10px] font-bold px-2.5 py-0.5 rounded-full mb-1" style="background-color: var(--color-accent); color: #FFF;">الدور القادم في الطابور</span>` : ''}
                        <p class="font-quran text-base ds-text-primary">${item.title}</p>
                      </div>

                      <div class="flex items-center gap-1.5 shrink-0">
                        ${!isNext ? `
                          <button onclick="setPointerToItem('${item.id}')" class="px-3 py-1.5 rounded-full ds-btn-soft text-[11px] font-bold">
                            ابدأ من هنا
                          </button>
                        ` : ''}
                        <button onclick="deleteRubItem('${item.id}')" title="حذف الربع" class="p-1.5 rounded-full ds-text-secondary hover:opacity-80">
                          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                          </svg>
                        </button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderSettingsView() {
      return `
        <div class="space-y-4 animate-screen">
          <!-- Profile Summary Card -->
          <div class="ds-surface rounded-3xl p-5 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-full overflow-hidden border ds-border">
                ${renderAvatarVisual(state.userProfile.avatarId, state.userProfile.name, 48)}
              </div>
              <div>
                <h3 class="text-base font-bold ds-text-primary">${state.userProfile.name || 'مستخدم آنيس'}</h3>
                <p class="text-xs ds-text-secondary">${state.userProfile.pronoun === 'sister' ? 'أختي (أنثى)' : 'أخي (ذكر)'}</p>
              </div>
            </div>
            <button onclick="reopenOnboardingSetup()" class="px-3.5 py-2 rounded-full ds-btn-soft text-xs font-bold">
              تعديل الملف
            </button>
          </div>

          <!-- Daily Near & Far Limits -->
          <div class="ds-surface rounded-3xl p-5 space-y-4">
            <h3 class="text-sm font-bold ds-text-primary">تخصيص الورد اليومي</h3>

            <div>
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-xs font-bold ds-text-primary">أرباع الماضي القريب (تسميع يومي)</span>
                <span class="text-[11px] ds-text-secondary">آخر ما حفظته</span>
              </div>
              <div class="flex items-center justify-between ds-surface-alt p-2 rounded-full tabular-nums">
                <button onclick="updateDailyNearLimit(1)" class="w-9 h-9 rounded-full ds-surface font-bold text-lg ds-text-primary active:scale-90 transition">+</button>
                <div class="text-center">
                  <span class="text-xl font-bold ds-text-primary">${state.dailyNearLimit ?? 4}</span>
                  <span class="text-[11px] ds-text-secondary mr-1">أرباع</span>
                </div>
                <button onclick="updateDailyNearLimit(-1)" class="w-9 h-9 rounded-full ds-surface font-bold text-lg ds-text-primary active:scale-90 transition">−</button>
              </div>
            </div>

            <div>
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-xs font-bold ds-text-primary">أرباع الماضي البعيد (الورد الدوري)</span>
                <span class="text-[11px] ds-text-secondary">بترتيب المصحف</span>
              </div>
              <div class="flex items-center justify-between ds-surface-alt p-2 rounded-full tabular-nums">
                <button onclick="updateDailyFarLimit(1)" class="w-9 h-9 rounded-full ds-surface font-bold text-lg ds-text-primary active:scale-90 transition">+</button>
                <div class="text-center">
                  <span class="text-xl font-bold ds-text-primary">${state.dailyFarLimit}</span>
                  <span class="text-[11px] ds-text-secondary mr-1">أرباع</span>
                </div>
                <button onclick="updateDailyFarLimit(-1)" class="w-9 h-9 rounded-full ds-surface font-bold text-lg ds-text-primary active:scale-90 transition">−</button>
              </div>
            </div>
          </div>

          <!-- Backup & Restore -->
          <div class="ds-surface rounded-3xl p-5 space-y-3">
            <h3 class="text-sm font-bold ds-text-primary">النسخ الاحتياطي ونقل البيانات</h3>
            <div class="grid grid-cols-2 gap-2.5">
              <button onclick="exportBackupData()" class="py-3 px-3 rounded-full ds-surface-alt ds-text-primary text-xs font-bold">
                تصدير نسخة
              </button>
              <button onclick="openImportBackupModal()" class="py-3 px-3 rounded-full ds-surface-alt ds-text-primary text-xs font-bold">
                استعادة نسخة
              </button>
            </div>
          </div>

          <!-- Reset Zone -->
          <div class="ds-surface rounded-3xl p-5 space-y-2.5">
            <h3 class="text-xs font-bold" style="color: var(--color-error);">إدارة الدورة والبيانات</h3>
            <button onclick="confirmResetCycle()" class="w-full py-3 px-4 rounded-full ds-surface-alt ds-text-primary text-xs font-bold text-right">
              إعادة المراجعة من أول سورة في محفوظاتك
            </button>
            <button onclick="confirmClearAllData()" class="w-full py-3 px-4 rounded-full text-xs font-bold text-right text-white" style="background-color: var(--color-error);">
              مسح جميع المحفوظات والبدء من الصفر
            </button>
          </div>
        </div>
      `;
    }

    function reopenOnboardingSetup() {
      obScope = state.items.length >= 230 ? 'full' : 'partial';
      obFullPace = state.dailyFarLimit || 8;
      obCustomNear = state.dailyNearLimit ?? 4;
      obCustomFar = state.dailyFarLimit ?? 4;
      enterOnboarding();
    }

    function updateDailyNearLimit(delta) {
      const current = state.dailyNearLimit ?? 4;
      const next = current + delta;
      if (next < 0 || next > 20) return;
      state.dailyNearLimit = next;
      saveState();
      renderApp();
    }

    function updateDailyFarLimit(delta) {
      const next = state.dailyFarLimit + delta;
      if (next < 0 || next > 30) return;
      state.dailyFarLimit = next;
      saveState();
      renderApp();
    }

    function confirmResetCycle() {
      openModal({
        title: 'إعادة دورة المراجعة من البداية',
        bodyHtml: 'سيتم إعادة مؤشر المراجعة إلى أول ربع في قائمة محفوظاتك وتحديث ورد اليوم.',
        buttons: [
          { label: 'إلغاء', className: 'px-4 py-2 rounded-full text-xs font-bold ds-surface-alt ds-text-primary' },
          {
            label: 'نعم، أعد الضبط',
            className: 'px-4 py-2 rounded-full text-xs font-bold ds-btn-primary',
            onClick: () => {
              state.pointerIndex = 0;
              state.cycleReviewedCount = 0;
              state.todaySession.farTasks = [];
              populateFarTasksForToday([]);
              saveState();
              showToast('تمت إعادة المراجعة من البداية', 'success');
              switchTab('home');
            }
          }
        ]
      });
    }

    function confirmClearAllData() {
      openModal({
        title: 'مسح جميع البيانات',
        bodyHtml: 'سيتم حذف جميع السور والأرباع المسجلة والعودة لشاشة الإعداد الأولي. هل أنت متأكد؟',
        buttons: [
          { label: 'إلغاء', className: 'px-4 py-2 rounded-full text-xs font-bold ds-surface-alt ds-text-primary' },
          {
            label: 'نعم، امسح الكل',
            className: 'px-4 py-2 rounded-full text-xs font-bold text-white',
            style: 'background-color: var(--color-error);',
            onClick: () => {
              const keepDark = state.darkMode;
              state = JSON.parse(JSON.stringify(defaultState));
              state.darkMode = keepDark;
              obChips = [];
              obScope = '';
              obFullPace = 0;
              saveState();
              showToast('تم مسح جميع البيانات');
              enterOnboarding();
            }
          }
        ]
      });
    }

    /**
     * =========================================================================
     * 12. INITIALIZATION & PWA SERVICE WORKER
     * =========================================================================
     */
    window.addEventListener('DOMContentLoaded', startAppFlow);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
