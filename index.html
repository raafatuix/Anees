  <!-- Tailwind CSS -->

  <style>
    /* =========================================================================
       THMANYAH SERIF DISPLAY CUSTOM FONT-FACE DEFINITIONS
       ========================================================================= */
    @font-face {
      font-family: 'thmanyah serif display';
      src: url('./fonts/thmanyahserifdisplay-Light.otf') format('opentype');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'thmanyah serif display';
      src: url('./fonts/thmanyahserifdisplay-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'thmanyah serif display';
      src: url('./fonts/thmanyahserifdisplay-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'thmanyah serif display';
      src: url('./fonts/thmanyahserifdisplay-Bold.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'thmanyah serif display';
      src: url('./fonts/thmanyahserifdisplay-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'thmanyah serif display';
      src: url('./fonts/thmanyahserifdisplay-Black.otf') format('opentype');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    /* =========================================================================
       ANEES DESIGN SYSTEM TOKENS (LIGHT & DARK MODES)
       ========================================================================= */
    :root {
      --bg-canvas: #F1EFEA;
      --bg-surface: #FFFFFF;
      --bg-surface-alt: #E5E3DD;
      --bg-pill-soft: #EFECE6;

      --color-primary: #20211F;
      --color-primary-soft: #E5E3DD;
      --color-accent: #DF713B;
      --bg-accent-soft: #F3DFD1;

      --text-primary: #20211F;
      --text-secondary: #5C5B52;
      --text-on-primary: #FFFFFF;

      --border-subtle: #E2DFD7;
      --shadow-card: 0px 2px 16px rgba(32, 33, 31, 0.03);
      --shadow-dock: 0px 8px 28px rgba(32, 33, 31, 0.08);

      --color-success: #426347;
      --bg-success-soft: #E4EBDF;
      --color-warning: #80551F;
      --bg-warning-soft: #F3E7D4;
      --color-error: #A33D36;
      --bg-error-soft: #F4E0DA;
      --color-info: #3D5A73;
      --bg-info-soft: #E1E8EF;
    }

    [data-theme="dark"] {
      --bg-canvas: #20211E;
      --bg-surface: #262824;
      --bg-surface-alt: #343731;
      --bg-pill-soft: #2E312B;

      --color-primary: #F4F2EB;
      --color-primary-soft: #343731;
      --color-accent: #F49B68;
      --bg-accent-soft: #443025;

      --text-primary: #F4F2EB;
      --text-secondary: #B8BAB0;
      --text-on-primary: #20211F;

      --border-subtle: #3D4139;
      --shadow-card: 0px 4px 20px rgba(0, 0, 0, 0.25);
      --shadow-dock: 0px 8px 28px rgba(0, 0, 0, 0.4);

      --color-success: #79A37E;
      --bg-success-soft: #2B3829;
      --color-warning: #E9C38A;
      --bg-warning-soft: #403524;
      --color-error: #F3AAA0;
      --bg-error-soft: #452B28;
      --color-info: #AFC9E0;
      --bg-info-soft: #293641;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: 'thmanyah serif display', 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      overscroll-behavior-y: contain;
    }

    .font-quran {
      font-family: 'Amiri', serif;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    ::-webkit-scrollbar { width: 0px; height: 0px; }

    /* Design System Surfaces & Buttons */
    .ds-canvas { background-color: var(--bg-canvas); }
    .ds-surface {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-card);
    }
    .ds-surface-clean {
      background-color: var(--bg-surface);
      box-shadow: var(--shadow-card);
    }
    .ds-surface-alt {
      background-color: var(--bg-surface-alt);
    }
    .ds-pill-soft {
      background-color: var(--bg-pill-soft);
    }
    .ds-text-primary { color: var(--text-primary); }
    .ds-text-secondary { color: var(--text-secondary); }
    .ds-border { border-color: var(--border-subtle); }

    .ds-btn-primary {
      background-color: var(--color-primary);
      color: var(--text-on-primary);
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.18s ease, background-color 0.2s ease;
    }
    .ds-btn-primary:hover:not(:disabled) { opacity: 0.94; }
    .ds-btn-primary:active:not(:disabled) { transform: scale(0.97); }
    .ds-btn-primary:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    /* Sticky Bottom Action Container */
    .sticky-cta-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 35;
      pointer-events: none;
      background: linear-gradient(to top, var(--bg-canvas) 72%, color-mix(in srgb, var(--bg-canvas) 0%, transparent) 100%);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px)) 20px;
    }
    .sticky-cta-bar > div {
      max-width: 32rem;
      margin: 0 auto;
      pointer-events: auto;
    }

    /* Smart Animate & Smooth Micro-interactions */
    @keyframes splashLogoIn {
      0% { opacity: 0; transform: scale(0.84) translateY(16px); }
      65% { opacity: 1; transform: scale(1.03) translateY(-2px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes chipPopIn {
      0% { opacity: 0; transform: scale(0.85) translateY(4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }
    @keyframes twinkleStar {
      0%, 100% { opacity: 0.04; transform: scale(1); }
      50% { opacity: 0.09; transform: scale(1.06); }
    }
    @keyframes rayPulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes slideUpSheet {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes slideDownSheet {
      from { transform: translateY(0); }
      to { transform: translateY(100%); }
    }

    .splash-logo-anim { animation: splashLogoIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .splash-title-anim { opacity: 0; animation: fadeSlideUp 0.6s ease-out 0.32s forwards; }
    .splash-subtitle-anim { opacity: 0; animation: fadeSlideUp 0.6s ease-out 0.5s forwards; }
    .splash-footer-anim { opacity: 0; animation: fadeSlideUp 0.6s ease-out 0.68s forwards; }
    .bg-helal-anim { animation: gentleFloat 5s ease-in-out infinite; }
    .bg-star-anim { animation: twinkleStar 4s ease-in-out infinite; }
    .logo-rays { transform-origin: 28px 18px; animation: rayPulse 2.4s ease-in-out infinite; }

    .smart-fade { animation: fadeSlideUp 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .chip-enter { animation: chipPopIn 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .bottom-sheet-enter { animation: slideUpSheet 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .bottom-sheet-exit { animation: slideDownSheet 0.22s cubic-bezier(0.4, 0, 1, 1) forwards; }

    /* Custom Inputs & Selects */
    .anees-input {
      width: 100%;
      height: 52px;
      padding: 0 20px;
      border-radius: 999px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 18px;
      font-weight: 500;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .anees-input::placeholder { color: var(--text-secondary); opacity: 0.55; }
    .anees-input:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    .anees-select-wrap { position: relative; width: 100%; }
    .anees-select {
      width: 100%;
      height: 52px;
      padding: 0 20px 0 44px;
      border-radius: 999px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 18px;
      font-weight: 500;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    .anees-select:focus { outline: none; border-color: var(--color-primary); }
    .anees-select-chevron {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-primary);
    }

    /* Avatar Ring Selection */
    .avatar-btn {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .avatar-btn:active { transform: scale(0.92); }
    .avatar-btn.selected {
      box-shadow: 0 0 0 3px var(--bg-canvas), 0 0 0 5.5px var(--color-primary);
    }

    /* Option Cards */
    .option-card {
      width: 100%;
      padding: 18px 20px;
      border-radius: 24px;
      background-color: var(--bg-surface);
      border: 1.5px solid var(--border-subtle);
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      text-align: right;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }
    .option-card:active:not(.disabled) { transform: scale(0.985); }
    .option-card.selected {
      background-color: var(--bg-surface-alt);
      border-color: var(--color-primary);
    }
    .option-card.disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    .radio-circle {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1.5px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.2s ease;
    }
    .option-card.selected .radio-circle { border-color: var(--color-primary); }
    .radio-dot {
      width: 11px;
      height: 11px;
      border-radius: 999px;
      background-color: var(--color-primary);
      transform: scale(0);
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .option-card.selected .radio-dot { transform: scale(1); }

    /* Single-line Ayah Ellipsis */
    .ayah-single-line {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      width: 100%;
    }
  </style>
</head>

    function getLocalTodayISO() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      const local = new Date(now.getTime() - offset * 60000);
      return local.toISOString().split('T')[0];
    }

    function getHijriDateFormatted() {
      const now = new Date();
      try {
        return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {
          weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        }).format(now);
      } catch (e) {
        return new Intl.DateTimeFormat('ar-EG', {
          weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        }).format(now);
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('anees_quran_v1');
        if (!raw) return JSON.parse(JSON.stringify(defaultState));
        const parsed = JSON.parse(raw);
        if (parsed.items && parsed.items.length > 0 && parsed.onboardingCompleted === undefined) {
          parsed.onboardingCompleted = true;
        }
        return {
          ...JSON.parse(JSON.stringify(defaultState)),
          ...parsed,
          userProfile: { ...defaultState.userProfile, ...(parsed.userProfile || {}) }
        };
      } catch (e) {
        return JSON.parse(JSON.stringify(defaultState));
      }
    }

    function saveState() {
      try {
        sortItemsInMushafOrder();
        recordTodaySnapshot();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        showToast('تعذر حفظ البيانات محلياً', 'error');
      }
    }

    function sortItemsInMushafOrder() {
      const currentTargetId = state.items[state.pointerIndex]?.id;
      state.items.sort((a, b) => {
        if (a.surahId !== b.surahId) return a.surahId - b.surahId;
        return a.rubOrder - b.rubOrder;
      });
      if (state.items.length === 0) {
        state.pointerIndex = 0;
      } else if (currentTargetId) {
        const idx = state.items.findIndex(i => i.id === currentTargetId);
        state.pointerIndex = idx !== -1 ? idx : (state.pointerIndex % state.items.length);
      } else {
        state.pointerIndex = state.pointerIndex % state.items.length;
      }
    }

    function getNearPastItems() {
      const limit = state.dailyNearLimit ?? 4;
      if (state.items.length === 0 || limit <= 0) return [];
      const validRecent = state.recentAddedIds
        .map(id => state.items.find(it => it.id === id))
        .filter(Boolean);

      if (validRecent.length >= limit) {
        return validRecent.slice(0, limit);
      }
      const sortedByRecent = [...state.items].sort((a, b) => b.addedAt - a.addedAt);
      return sortedByRecent.slice(0, Math.min(limit, sortedByRecent.length));
    }

    function syncDailySession() {
      const todayISO = getLocalTodayISO();
      sortItemsInMushafOrder();

      state.todaySession.farTasks = (state.todaySession.farTasks || []).filter(t =>
        state.items.some(it => it.id === t.itemId)
      );
      state.todaySession.nearDoneIds = (state.todaySession.nearDoneIds || []).filter(id =>
        state.items.some(it => it.id === id)
      );

      if (state.todaySession.date === todayISO) {
        if (state.items.length > 0 && state.todaySession.farTasks.length === 0 && state.dailyFarLimit > 0) {
          populateFarTasksForToday([]);
          saveState();
        }
        return;
      }

      if (state.todaySession.date) {
        recordSnapshotForDate(state.todaySession.date);
      }

      const uncompletedFromYesterday = (state.todaySession.farTasks || [])
        .filter(t => !t.done && state.items.some(it => it.id === t.itemId))
        .map(t => ({ itemId: t.itemId, done: false, carriedOver: true }));

      state.todaySession = {
        date: todayISO,
        farTasks: [],
        nearDoneIds: [],
        carriedOverCount: uncompletedFromYesterday.length
      };

      if (state.items.length > 0) {
        populateFarTasksForToday(uncompletedFromYesterday);
      }

      saveState();
    }

    function populateFarTasksForToday(carriedTasks) {
      const total = state.items.length;
      if (total === 0) return;

      const tasks = [...carriedTasks];
      const existingIds = new Set(tasks.map(t => t.itemId));
      const targetCount = Math.min(state.dailyFarLimit, total);

      let safety = 0;
      while (tasks.length < targetCount && safety < total) {
        const candidate = state.items[state.pointerIndex % total];
        state.pointerIndex = (state.pointerIndex + 1) % total;
        if (!existingIds.has(candidate.id)) {
          tasks.push({ itemId: candidate.id, done: false, carriedOver: false });
          existingIds.add(candidate.id);
        }
        safety++;
      }

      state.todaySession.farTasks = tasks;
    }

    function addExtraRubToToday() {
      const total = state.items.length;
      if (total === 0) return;

      const currentIds = new Set(state.todaySession.farTasks.map(t => t.itemId));
      if (currentIds.size >= total) {
        showToast('لقد أضفت جميع أرباع محفوظك في قائمة اليوم ما شاء الله!', 'info');
        return;
      }

      let addedItem = null;
      let safety = 0;
      while (safety < total) {
        const candidate = state.items[state.pointerIndex % total];
        state.pointerIndex = (state.pointerIndex + 1) % total;
        if (!currentIds.has(candidate.id)) {
          state.todaySession.farTasks.push({
            itemId: candidate.id,
            done: false,
            carriedOver: false,
            isExtra: true
          });
          addedItem = candidate;
          break;
        }
        safety++;
      }

      saveState();
      if (isReviewOpen) renderReviewFullScreen();
      renderApp();
      if (addedItem) {
        showToast('تم إضافة ربع إضافي لورد اليوم', 'info');
      }
    }

    function removeExtraTaskFromToday(itemId) {
      const idx = state.todaySession.farTasks.findIndex(t => t.itemId === itemId && t.isExtra);
      if (idx === -1) return;
      state.todaySession.farTasks.splice(idx, 1);
      saveState();
      if (isReviewOpen) renderReviewFullScreen();
      renderApp();
    }

    function toggleFarTaskDone(itemId) {
      const task = state.todaySession.farTasks.find(t => t.itemId === itemId);
      if (!task) return;

      task.done = !task.done;
      if (task.done) {
        state.cycleReviewedCount += 1;
        if (state.items.length > 0 && state.cycleReviewedCount >= state.items.length) {
          state.cycleReviewedCount = 0;
          state.completedCycles += 1;
          showToast(`مبارك! أتممت دورة مراجعة كاملة (${state.completedCycles})`, 'info');
        }
      } else {
        state.cycleReviewedCount = Math.max(0, state.cycleReviewedCount - 1);
      }

      saveState();
      if (isReviewOpen) renderReviewFullScreen();
      renderApp();
    }

    function toggleNearTaskDone(itemId) {
      const idx = state.todaySession.nearDoneIds.indexOf(itemId);
      if (idx === -1) {
        state.todaySession.nearDoneIds.push(itemId);
      } else {
        state.todaySession.nearDoneIds.splice(idx, 1);
      }
      saveState();
      if (isReviewOpen) renderReviewFullScreen();
      renderApp();
    }

    function recordTodaySnapshot() {
      recordSnapshotForDate(getLocalTodayISO());
    }

    function recordSnapshotForDate(dateISO) {
      if (!dateISO) return;
      const nearItems = getNearPastItems();
      const farTasks = state.todaySession.farTasks || [];
      const nearDoneCount = nearItems.filter(it => (state.todaySession.nearDoneIds || []).includes(it.id)).length;
      const farDoneCount = farTasks.filter(t => t.done).length;

      state.historyLogs[dateISO] = {
        totalTasks: nearItems.length + farTasks.length,
        completedTasks: nearDoneCount + farDoneCount,
        farDone: farDoneCount,
        farTotal: farTasks.length,
        nearDone: nearDoneCount,
        nearTotal: nearItems.length
      };
    }

    function skipSplash() {
      if (splashTimeoutId) clearTimeout(splashTimeoutId);
      finishSplash();
    }

    function finishSplash() {
      const splash = document.getElementById('splashScreen');
      if (!splash || splash.classList.contains('hidden')) return;

      splash.style.opacity = '0';
      setTimeout(() => {
        splash.classList.add('hidden');
        if (state.onboardingCompleted) {
          enterMainApp();
        } else {
          enterOnboarding();
        }
      }, 380);

    function handleObAddJuz(juzId) {
      const juz = JUZ_LIST.find(j => j.id === Number(juzId));
      if (!juz) return;
      if (obChips.some(c => c.type === 'juz' && c.juzId === juz.id)) {
        showToast(`${juz.name} مضاف بالفعل`, 'info');
        return;
      }
      obChips.push({
        uid: `juz_${juz.id}`,
        type: 'juz',
        label: juz.name,
        sortOrder: juz.id * 1000,
        juzId: juz.id
      });
      renderObChipsOnly();
    }

    function handleObAddSurah(surahId) {
      const surah = QURAN_DATA.find(s => s.id === Number(surahId));
      if (!surah) return;
      if (obChips.some(c => c.type === 'surah' && c.surahId === surah.id)) {
        showToast(`سورة ${surah.name} مضافة بالفعل`, 'info');
        return;
      }
      obChips.push({
        uid: `surah_${surah.id}`,
        type: 'surah',
        label: `سورة ${surah.name}`,
        sortOrder: 50000 + surah.id * 100,
        surahId: surah.id
      });
      renderObChipsOnly();
    }

    function handleObSelectSurahForRub(surahId) {
      obSelectedSurahForRub = surahId;
      renderObHifzDropdownsOnly();
    }

    function handleObAddUptoRub(uptoRub) {
      const surah = QURAN_DATA.find(s => s.id === Number(obSelectedSurahForRub));
      const rubIdx = Number(uptoRub);
      if (!surah || !rubIdx) return;

      const existingIdx = obChips.findIndex(c => (c.type === 'rub' || c.type === 'surah') && c.surahId === surah.id);
      const chipObj = {
        uid: `rub_${surah.id}_${rubIdx}`,
        type: 'rub',
        label: `سورة ${surah.name} (حتى الربع ${rubIdx})`,
        sortOrder: 50000 + surah.id * 100 + rubIdx,
        surahId: surah.id,
        uptoRub: rubIdx
      };
      if (existingIdx !== -1) obChips[existingIdx] = chipObj;
      else obChips.push(chipObj);

      obSelectedSurahForRub = '';
      renderObHifzDropdownsOnly();
      renderObChipsOnly();
    }

    function removeObChip(uid) {
      obChips = obChips.filter(c => c.uid !== uid);
      renderObChipsOnly();
    }

    function selectObFullPace(rubs) {
      obFullPace = rubs;
      document.querySelectorAll('#obFullPaceCards .option-card[data-pace]').forEach(card => {
        card.classList.toggle('selected', Number(card.dataset.pace) === rubs);
      });
      const btn = document.getElementById('obStep4FullStartBtn');
      if (btn) btn.disabled = false;
    }

    function adjustObWird(type, delta) {
      if (type === 'near') {
        obCustomNear = Math.max(1, Math.min(20, obCustomNear + delta));
        const cEl = document.getElementById('obNearCountText');
        const uEl = document.getElementById('obNearUnitText');
        const decBtn = document.getElementById('obNearDecBtn');
        if (cEl) cEl.textContent = obCustomNear;
        if (uEl) uEl.textContent = obCustomNear === 1 ? 'ربع' : 'أرباع';
        if (decBtn) decBtn.classList.toggle('opacity-60', obCustomNear <= 1);
      } else {
        obCustomFar = Math.max(1, Math.min(30, obCustomFar + delta));
        const cEl = document.getElementById('obFarCountText');
        const uEl = document.getElementById('obFarUnitText');
        const decBtn = document.getElementById('obFarDecBtn');
        if (cEl) cEl.textContent = obCustomFar;
        if (uEl) uEl.textContent = obCustomFar === 1 ? 'ربع' : 'أرباع';
        if (decBtn) decBtn.classList.toggle('opacity-60', obCustomFar <= 1);
      }
      updateObWirdSummaryDOM();
    }

    function updateObWirdSummaryDOM() {
      const p = document.getElementById('obWirdSummaryText');
      const startBtn = document.getElementById('obStep4CustomStartBtn');
      const estimatedTotalRubs = calculateEstimatedRubsFromChips(obChips);
      const totalDailyRubs = obCustomNear + obCustomFar;
      const cycleDays = obCustomFar > 0 ? Math.max(1, Math.ceil(estimatedTotalRubs / obCustomFar)) : 0;

      if (startBtn) startBtn.disabled = totalDailyRubs <= 0;
      if (!p) return;

      let juzEquivalentText = '';
      if (totalDailyRubs === 8) juzEquivalentText = ' (جزء واحد)';
      else if (totalDailyRubs === 4) juzEquivalentText = ' (نصف جزء)';
      else if (totalDailyRubs === 16) juzEquivalentText = ' (جزءان)';
      else if (totalDailyRubs > 8 && totalDailyRubs % 8 === 0) juzEquivalentText = ` (${totalDailyRubs / 8} أجزاء)`;

      p.innerHTML = `
        إجمالي وردك اليومي: <strong>${totalDailyRubs} ${totalDailyRubs === 1 ? 'ربع' : 'أرباع'}${juzEquivalentText}</strong>
        ${obCustomFar > 0
          ? ` - تُتمّ دورة مراجعة محفوظك كاملاً كل <strong>${cycleDays} ${cycleDays === 1 ? 'يوم' : cycleDays === 2 ? 'يومين' : cycleDays <= 10 ? 'أيام' : 'يوماً'}</strong>.`
          : ` - (تسميع يومي للماضي القريب فقط).`}
      `;
    }

    function calculateEstimatedRubsFromChips(chipsArr) {
      const uniqueRubKeys = new Set();
      chipsArr.forEach(chip => {
        if (chip.type === 'juz') {
          const juz = JUZ_LIST.find(j => j.id === chip.juzId);
          if (juz) {
            juz.surahs.forEach(entry => {
              for (let r = 1; r <= entry.upto; r++) uniqueRubKeys.add(`${entry.id}_${r}`);
            });
          }
        } else if (chip.type === 'surah') {
          const surah = QURAN_DATA.find(s => s.id === chip.surahId);
          if (surah) {
            for (let r = 1; r <= surah.rubList.length; r++) uniqueRubKeys.add(`${surah.id}_${r}`);
          }
        } else if (chip.type === 'rub') {
          for (let r = 1; r <= chip.uptoRub; r++) uniqueRubKeys.add(`${chip.surahId}_${r}`);
        }
      });
      return Math.max(1, uniqueRubKeys.size);
    }

    function commitChipsToLibrary(chipsArr, clearFirst = false) {
      if (clearFirst) {
        state.items = [];
        state.recentAddedIds = [];
        state.pointerIndex = 0;
        state.cycleReviewedCount = 0;
      }

      const newlyAddedIds = [];
      chipsArr.forEach(chip => {
        if (chip.type === 'juz') {
          const juz = JUZ_LIST.find(j => j.id === chip.juzId);
          if (juz) {
            juz.surahs.forEach(entry => {
              newlyAddedIds.push(...addUpToRubSilent(entry.id, entry.upto));
            });
          }
        } else if (chip.type === 'surah') {
          newlyAddedIds.push(...addFullSurahSilent(chip.surahId));
        } else if (chip.type === 'rub') {
          newlyAddedIds.push(...addUpToRubSilent(chip.surahId, chip.uptoRub));
        }
      });

      if (newlyAddedIds.length > 0) {
        const combined = [...newlyAddedIds.reverse(), ...state.recentAddedIds];
        state.recentAddedIds = [...new Set(combined)].slice(0, 25);
      }
      return newlyAddedIds.length;
    }

    function addFullSurahSilent(surahId) {
      const surah = QURAN_DATA.find(s => s.id === Number(surahId));
      if (!surah) return [];
      const addedIds = [];
      surah.rubList.forEach((rubTitle, index) => {
        const exists = state.items.some(item => item.surahId === surah.id && item.rubOrder === index + 1);
        if (!exists) {
          const newId = `s${surah.id}_r${index + 1}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
          state.items.push({
            id: newId,
            surahId: surah.id,
            surahName: surah.name,
            rubOrder: index + 1,
            mushafRubNum: Math.min(240, surah.startRub + index),
            title: rubTitle,
            addedAt: Date.now() + index
          });
          addedIds.push(newId);
        }
      });
      return addedIds;
    }

    function addUpToRubSilent(surahId, maxRubOrder) {
      const surah = QURAN_DATA.find(s => s.id === Number(surahId));
      if (!surah) return [];
      const addedIds = [];
      for (let i = 0; i < maxRubOrder; i++) {
        const exists = state.items.some(item => item.surahId === surah.id && item.rubOrder === i + 1);
        if (!exists) {
          const newId = `s${surah.id}_r${i + 1}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
          state.items.push({
            id: newId,
            surahId: surah.id,
            surahName: surah.name,
            rubOrder: i + 1,
            mushafRubNum: Math.min(240, surah.startRub + i),
            title: surah.rubList[i],
            addedAt: Date.now() + i
          });
          addedIds.push(newId);
        }
      }
      return addedIds;
    }

    function completeOnboardingFlow() {
      if (obScope === 'full') {
        state.items = [];
        state.recentAddedIds = [];
        state.pointerIndex = 0;
        state.cycleReviewedCount = 0;
        QURAN_DATA.forEach(s => addFullSurahSilent(s.id));
        state.dailyNearLimit = 0;
        state.dailyFarLimit = obFullPace || 8;
      } else {
        commitChipsToLibrary(obChips, true);
        state.dailyNearLimit = obCustomNear;
        state.dailyFarLimit = obCustomFar;
      }

      sortItemsInMushafOrder();
      state.todaySession = {
        date: getLocalTodayISO(),
        farTasks: [],
        nearDoneIds: [],
        carriedOverCount: 0
      };
      populateFarTasksForToday([]);
      state.onboardingCompleted = true;
      saveState();

      enterMainApp();

      if (type === 'error') bg = '#A33D36';

    function getTodaySummaryData() {
      const nearItems = getNearPastItems();
      const farTasks = state.todaySession.farTasks || [];
      const nearDoneCount = nearItems.filter(it => state.todaySession.nearDoneIds.includes(it.id)).length;
      const farDoneCount = farTasks.filter(t => t.done).length;
      const totalToday = nearItems.length + farTasks.length;
      const doneToday = nearDoneCount + farDoneCount;
      const todayPct = totalToday > 0 ? Math.round((doneToday / totalToday) * 100) : 0;

      const surahNamesSet = new Set();
      nearItems.forEach(it => surahNamesSet.add(it.surahName));
      farTasks.forEach(t => {
        const it = state.items.find(x => x.id === t.itemId);
        if (it) surahNamesSet.add(it.surahName);
      });

      return {
        nearItems,
        farTasks,
        nearDoneCount,
        farDoneCount,
        totalToday,
        doneToday,
        todayPct,
        surahNames: Array.from(surahNamesSet)
      };
    }

    function calculateStreak() {
      let streak = 0;
      const now = new Date();
      for (let i = 0; i < 60; i++) {
        const d = new Date(now.getTime() - i * 86400000);
        const offset = d.getTimezoneOffset();
        const iso = new Date(d.getTime() - offset * 60000).toISOString().split('T')[0];
        const log = state.historyLogs[iso];
        if (log && log.completedTasks > 0) streak++;
        else if (i > 0) break;
      }
      return streak;
    }

    function getLast7DaysChartData() {
      const days = [];
      const dayNames = ['الأحد', 'الاثنين', 'الثلاثاء', 'الاربعاء', 'الخميس', 'الجمعة', 'السبت'];
      const now = new Date();

      for (let i = 6; i >= 0; i--) {
        const d = new Date(now.getTime() - i * 86400000);
        const offset = d.getTimezoneOffset();
        const iso = new Date(d.getTime() - offset * 60000).toISOString().split('T')[0];
        const log = state.historyLogs[iso];
        const pct = (log && log.totalTasks > 0) ? Math.min(100, Math.round((log.completedTasks / log.totalTasks) * 100)) : 0;
        days.push({
          iso,
          label: dayNames[d.getDay()],
          pct
        });
      }
      return days;
    }

                      ` : ''}

    // =========================================================================
    // VIEW C: ARCHIVES / MEMORIZED (المحفوظ - MATCHING FIGMA 100%)

    function renderLibraryView() {
      if (state.items.length === 0) {
        return `
          <div class="min-h-[72vh] flex flex-col items-center justify-center text-center px-6 smart-fade">
            <div class="w-16 h-16 rounded-full ds-surface-clean flex items-center justify-center mb-4 ds-text-primary">

                <path stroke-linecap="round" stroke-linejoin="round" d="M21 8v11a2 2 0 01-2 2H5a2 2 0 01-2-2V8m18 0l-2-4H5L3 8m18 0H3m7 4h4" />
              </svg>
            </div>

                <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m7-7H5" />
              </svg>
              <span>إضافة محفوظات</span>
            </button>
          </div>
        `;
      }

      const groups = [];
      state.items.forEach(item => {
        let group = groups.find(g => g.surahId === item.surahId);
        if (!group) {
          group = { surahId: item.surahId, surahName: item.surahName, items: [] };
          groups.push(group);
        }
        group.items.push(item);
      });

      const q = normalizeArabicForSearch(librarySearch);
      const filteredGroups = q
        ? groups.map(g => {
            if (normalizeArabicForSearch(g.surahName).includes(q)) return g;
            const matchingItems = g.items.filter(it => normalizeArabicForSearch(it.title).includes(q));
            return matchingItems.length > 0 ? { ...g, items: matchingItems } : null;
          }).filter(Boolean)
        : groups;

      return `
        <div class="space-y-4 smart-fade">
          <!-- Header Row: "محفوظاتك" + Pill Count -->
          <div class="flex items-center justify-between px-1">
            <h1 class="text-2xl font-bold ds-text-primary">محفوظاتك</h1>
            <span class="px-3.5 py-1.5 rounded-full text-xs font-bold tabular-nums" style="background-color: var(--bg-success-soft); color: var(--color-success);">
              ${state.items.length} ربعاً
            </span>
          </div>

          <!-- Search Pill Input -->
          <div class="relative">
            <input
              type="text"
              value="${librarySearch.replace(/"/g, '&quot;')}"
              oninput="handleLibrarySearch(this.value)"
              placeholder="ابحث باسم السورة أو بداية الربع..."
              class="anees-input pr-11 text-[16px]"
            />
            <svg class="w-5 h-5 ds-text-secondary absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7" />
              <path stroke-linecap="round" d="M20 20l-3.5-3.5" />
            </svg>
          </div>

          <!-- Surah Accordion Cards -->
          <div id="librarySurahCardsList" class="space-y-4">
            ${filteredGroups.map(group => renderSurahArchiveCard(group)).join('')}
          </div>
        </div>
      `;
    }

    function renderSurahArchiveCard(group) {
      const isExpanded = expandedSurahIds.has(group.surahId);
      const visibleItems = isExpanded ? group.items : group.items.slice(0, 5);
      const remainingCount = group.items.length - 5;
      const countFormatted = String(group.items.length).padStart(2, '0');

      return `
        <div class="ds-surface-clean rounded-[24px] overflow-hidden">
          <!-- Green-Tinted Surah Header -->
          <div class="px-4 py-3 flex items-center justify-between" style="background-color: var(--bg-success-soft);">
            <div class="flex items-center gap-2">
              <h3 class="text-[16px] font-bold ds-text-primary">سورة ${group.surahName}</h3>
              <span class="text-xs font-medium ds-text-secondary tabular-nums">(${countFormatted})</span>
            </div>

            <div class="flex items-center gap-3">
              <button type="button" onclick="openDeleteSurahSheet(${group.surahId}, '${group.surahName}')" aria-label="حذف السورة" style="color: var(--color-error);">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
              ${group.items.length > 5 ? `
                <button type="button" onclick="toggleSurahExpand(${group.surahId})" aria-label="توسيع" class="ds-text-primary transition-transform duration-200 ${isExpanded ? 'rotate-180' : ''}">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                  </svg>
                </button>
              ` : ''}
            </div>
          </div>

          <!-- Rub Rows -->
          <div class="divide-y ds-border">
            ${visibleItems.map(item => {
              const rubOrderFormatted = String(item.rubOrder).padStart(2, '0');
              return `
                <div class="px-4 py-3.5 flex items-center justify-between gap-3">
                  <div class="min-w-0 flex-1">
                    <span class="text-xs font-bold ds-text-primary block mb-1 tabular-nums">#${rubOrderFormatted}</span>
                    <p class="font-quran text-lg ds-text-primary ayah-single-line">${item.title}</p>
                  </div>
                  <button type="button" onclick="deleteSingleRubDirect('${item.id}')" aria-label="حذف الربع" class="p-1.5 shrink-0" style="color: var(--color-error);">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>

                </div>
              `;
            }).join('')}

          <!-- Expand Footer Button if > 5 Rub's -->
          ${remainingCount > 0 ? `
            <button type="button" onclick="toggleSurahExpand(${group.surahId})" class="w-full py-3 px-4 border-t ds-border text-xs font-bold flex items-center justify-center gap-1.5 tabular-nums" style="color: var(--color-success);">

              <svg class="w-4 h-4 transition-transform duration-200 ${isExpanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </button>
          ` : ''}
        </div>
      `;
    }

    function normalizeArabicForSearch(str) {
      if (!str) return '';
      return str
        .replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, '') // Remove all Quranic tashkeel, harakat, waqf marks & tatweel
        .replace(/[أإآٱ]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/ؤ/g, 'ء')
        .replace(/ئ/g, 'ء')
        .trim()
        .toLowerCase();
    }

    function handleLibrarySearch(val) {
      librarySearch = val;
      const listEl = document.getElementById('librarySurahCardsList');
      if (!listEl) return;

      const groups = [];
      state.items.forEach(item => {
        let group = groups.find(g => g.surahId === item.surahId);
        if (!group) {
          group = { surahId: item.surahId, surahName: item.surahName, items: [] };
          groups.push(group);
        }
        group.items.push(item);
      });

      const q = normalizeArabicForSearch(librarySearch);
      const filteredGroups = q
        ? groups.map(g => {
            if (normalizeArabicForSearch(g.surahName).includes(q)) return g;
            const matchingItems = g.items.filter(it => normalizeArabicForSearch(it.title).includes(q));
            return matchingItems.length > 0 ? { ...g, items: matchingItems } : null;
          }).filter(Boolean)
        : groups;

      listEl.innerHTML = filteredGroups.map(group => renderSurahArchiveCard(group)).join('');
    }

    function toggleSurahExpand(surahId) {
      if (expandedSurahIds.has(surahId)) expandedSurahIds.delete(surahId);
      else expandedSurahIds.add(surahId);
      renderApp();
    }

    function deleteSingleRubDirect(itemId) {
      const item = state.items.find(i => i.id === itemId);
      if (!item) return;
      const rubNum = String(item.rubOrder).padStart(2, '0');
      openUniversalSheet(`

              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            <span>حذف الربع</span>
          </button>
        </div>
      `);
    }

    function confirmDeleteSingleRub(itemId) {
      state.items = state.items.filter(i => i.id !== itemId);
      state.recentAddedIds = state.recentAddedIds.filter(id => id !== itemId);
      state.todaySession.farTasks = state.todaySession.farTasks.filter(t => t.itemId !== itemId);

      saveState();
      closeUniversalSheet();
      renderApp();
      showToast('تم حذف الربع من المحفوظات', 'error');
    }

    function adjustSettingsWird(type, delta) {
      const nearWarnEl = document.getElementById('settingsNearWarning');
      const farWarnEl = document.getElementById('settingsFarWarning');
      const nearDecBtn = document.getElementById('settingsNearDecBtn');
      const farDecBtn = document.getElementById('settingsFarDecBtn');

      if (type === 'near') {
        const currentNear = Math.max(1, state.dailyNearLimit || 1);
        const nextNear = currentNear + delta;
        if (nextNear < 1) {
          settingsLimitWarning = 'near';
          if (nearWarnEl) nearWarnEl.classList.remove('hidden');
          if (farWarnEl) farWarnEl.classList.add('hidden');
          if (nearDecBtn) nearDecBtn.classList.add('opacity-60');
          return;
        }
        settingsLimitWarning = '';
        state.dailyNearLimit = nextNear;
        if (nearWarnEl) nearWarnEl.classList.add('hidden');
        if (farWarnEl) farWarnEl.classList.add('hidden');
        const cEl = document.getElementById('settingsNearCount');
        const uEl = document.getElementById('settingsNearUnit');
        if (cEl) cEl.textContent = nextNear;
        if (uEl) uEl.textContent = nextNear === 1 ? 'ربع' : 'أرباع';
        if (nearDecBtn) nearDecBtn.classList.toggle('opacity-60', nextNear <= 1);
      } else {
        const currentFar = Math.max(1, state.dailyFarLimit || 1);
        const nextFar = currentFar + delta;
        if (nextFar < 1) {
          settingsLimitWarning = 'far';
          if (farWarnEl) farWarnEl.classList.remove('hidden');
          if (nearWarnEl) nearWarnEl.classList.add('hidden');
          if (farDecBtn) farDecBtn.classList.add('opacity-60');
          return;
        }
        settingsLimitWarning = '';
        state.dailyFarLimit = nextFar;
        if (farWarnEl) farWarnEl.classList.add('hidden');
        if (nearWarnEl) nearWarnEl.classList.add('hidden');
        const cEl = document.getElementById('settingsFarCount');
        const uEl = document.getElementById('settingsFarUnit');
        if (cEl) cEl.textContent = nextFar;
        if (uEl) uEl.textContent = nextFar === 1 ? 'ربع' : 'أرباع';
        if (farDecBtn) farDecBtn.classList.toggle('opacity-60', nextFar <= 1);
      }

      saveState();
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {

    let lockedScrollY = 0;

    function lockBackgroundScroll() {
      lockedScrollY = window.scrollY || document.documentElement.scrollTop || 0;
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';
      document.body.style.position = 'fixed';
      document.body.style.top = `-${lockedScrollY}px`;
      document.body.style.left = '0';
      document.body.style.right = '0';
      document.body.style.width = '100%';
    }

    function unlockBackgroundScroll() {
      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';
      document.body.style.position = '';
      document.body.style.top = '';
      document.body.style.left = '';
      document.body.style.right = '';
      document.body.style.width = '';
      window.scrollTo(0, lockedScrollY);
    }

    function openUniversalSheet(htmlContent) {
      const sheet = document.getElementById('universalSheet');
      const panel = document.getElementById('universalSheetPanel');
      const body = document.getElementById('universalSheetBody');
      if (!sheet || !panel || !body) return;

      body.innerHTML = htmlContent;
      body.scrollTop = 0;
      panel.style.transform = '';
      panel.style.transition = '';
      panel.classList.remove('bottom-sheet-exit');
      panel.classList.add('bottom-sheet-enter');
      sheet.classList.remove('hidden');
      sheet.classList.add('flex');
      lockBackgroundScroll();
    }

    function closeUniversalSheet() {
      const sheet = document.getElementById('universalSheet');
      const panel = document.getElementById('universalSheetPanel');
      if (!sheet || !panel) return;

      panel.classList.remove('bottom-sheet-enter');
      panel.classList.remove('bottom-sheet-exit');
      // Force reflow so transition runs smoothly from whatever translateY(currentY) it currently has
      void panel.offsetHeight;
      panel.style.transition = 'transform 0.24s cubic-bezier(0.32, 0.72, 0, 1)';
      panel.style.transform = 'translateY(100%)';
      sheet.style.transition = 'opacity 0.24s ease';
      sheet.style.opacity = '0';

      setTimeout(() => {
        sheet.classList.add('hidden');
        sheet.classList.remove('flex');
        sheet.style.opacity = '';
        sheet.style.transition = '';
        panel.style.transform = '';
        panel.style.transition = '';
        unlockBackgroundScroll();
      }, 240);
    }

    function handleSheetBackdropClick(e) {
      if (e.target && e.target.id === 'universalSheet') {
        closeUniversalSheet();
      }
    }

    function initBottomSheetGestures() {
      const sheet = document.getElementById('universalSheet');
      const panel = document.getElementById('universalSheetPanel');
      const body = document.getElementById('universalSheetBody');
      if (!sheet || !panel || !body) return;

      let startY = 0;
      let currentY = 0;
      let isDragging = false;

      // Prevent touchmove on backdrop from scrolling background
      sheet.addEventListener('touchmove', (e) => {
        if (e.target === sheet) {
          e.preventDefault();
        }
      }, { passive: false });

      panel.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        startY = e.touches[0].clientY;
        currentY = 0;
        isDragging = true;
        panel.style.transition = 'none';
        panel.classList.remove('bottom-sheet-enter');
      }, { passive: true });

      panel.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const deltaY = e.touches[0].clientY - startY;
        // Drag down to dismiss whenever body is scrolled to top (or dragging the handle/header)
        if (deltaY > 0 && body.scrollTop <= 0) {
          e.preventDefault();
          currentY = deltaY;
          panel.style.transform = `translateY(${currentY}px)`;
        }
      }, { passive: false });

      panel.addEventListener('touchend', () => {
        if (!isDragging) return;
        isDragging = false;
        const dragged = currentY;
        currentY = 0;
        if (dragged > 75) {
          closeUniversalSheet();
        } else if (dragged > 0) {
          panel.style.transition = 'transform 0.24s cubic-bezier(0.22, 1, 0.36, 1)';
          panel.style.transform = 'translateY(0px)';
        }
      });
    }

              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 4v11m0-11l-4 4m4-4l4 4" />
              </svg>
            </div>
          </div>
        `
        : `
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <span class="w-7 h-7 rounded-full text-white text-xs font-bold flex items-center justify-center shrink-0" style="background-color: var(--color-accent);">1</span>
              <p class="text-[16px] ds-text-primary leading-snug">اضغط على زر <strong>القائمة</strong> في أعلى المتصفح</p>
            </div>
            <div class="w-10 h-10 rounded-xl ds-surface flex items-center justify-center shrink-0 ds-text-primary">
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="6" r="1.8" />
                <circle cx="12" cy="12" r="1.8" />
                <circle cx="12" cy="18" r="1.8" />
              </svg>
            </div>
          </div>
        `;

      openUniversalSheet(`
        <div class="space-y-4">
          <div>
            <h3 class="text-xl font-bold ds-text-primary">أضف آنيس لشاشتك الرئيسية</h3>
            <p class="text-xs ds-text-secondary mt-1">لوصول أسرع وتجربة كاملة بدون إنترنت</p>
          </div>

          <div class="ds-pill-soft rounded-[24px] p-4 space-y-4">
            ${step1Html}
            <div class="border-t ds-border"></div>
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <span class="w-7 h-7 rounded-full text-white text-xs font-bold flex items-center justify-center shrink-0" style="background-color: var(--color-accent);">2</span>
                <p class="text-[16px] ds-text-primary leading-snug">مرّر للأسفل واختر <strong>إضافة إلى الصفحة الرئيسية</strong></p>
              </div>
              <div class="w-10 h-10 rounded-xl ds-surface flex items-center justify-center shrink-0 ds-text-primary">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
                  <rect x="4" y="4" width="16" height="16" rx="3" />
                  <path stroke-linecap="round" d="M12 8v8m4-4H8" />
                </svg>
              </div>
            </div>
          </div>
        </div>
      `);
    }

    // SHEET 4: About App Sheet (Matches BS-04)
    function openAboutAppSheet() {
      openUniversalSheet(`
        <div class="space-y-3">
          <h3 class="text-xl font-bold ds-text-primary">عن التطبيق</h3>
          <p class="text-[16px] ds-text-secondary leading-loose">
            تطبيق "آنيس" هو رفيقك المثالي في رحلة حفظ القرآن الكريم. يتيح لك التطبيق تنظيم وردك اليومي بين الماضي القريب لتثبيت أحدث ما حفظت، والماضي البعيد للمراجعة الدورية بترتيب المصحف الشريف، مع توفير تجربة سلسة تعمل حتى في حالة عدم الاتصال بالإنترنت.
          </p>
        </div>
      `);
    }

    // SHEET 5: Restore Backup Sheet (Matches BS-05 & BS-05 Error)
    function openRestoreBackupSheet() {
      openUniversalSheet(`
        <div class="space-y-4">
          <div>
            <h3 class="text-xl font-bold ds-text-primary">استعادة نسخة احتياطية</h3>
            <p class="text-xs ds-text-secondary mt-1">الصق كود النسخة الاحتياطية هنا لاسترجاع محفوظاتك.</p>
          </div>

          <textarea
            id="restoreJsonTextarea"
            rows="5"
            dir="ltr"
            placeholder='{"items": [...]}'
            class="w-full p-4 rounded-2xl ds-surface-alt ds-text-primary text-xs font-mono focus:outline-none text-left"
          ></textarea>

          <p id="restoreErrorMsg" class="hidden text-xs font-bold text-center" style="color: var(--color-error);">
            تعذّرت الاستعادة، كود النسخة الاحتياطية غير صحيح
          </p>

          <button type="button" onclick="executeRestoreBackup()" class="w-full h-14 rounded-full ds-btn-primary font-medium text-[18px] flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 16V4m0 12l-4-4m4 4l4-4" />
            </svg>
            <span>استعادة البيانات</span>
          </button>
        </div>
      `);
    }

    function executeRestoreBackup() {
      const raw = document.getElementById('restoreJsonTextarea')?.value?.trim();
      const errEl = document.getElementById('restoreErrorMsg');
      if (!raw) {
        if (errEl) errEl.classList.remove('hidden');
        return;
      }
      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.items)) throw new Error('Invalid');
        state = { ...JSON.parse(JSON.stringify(defaultState)), ...parsed };
        state.onboardingCompleted = true;
        saveState();
        closeUniversalSheet();
        renderApp();
        showToast('تمت استعادة البيانات بنجاح', 'success');
      } catch (e) {
        if (errEl) errEl.classList.remove('hidden');
      }
    }

    // SHEET 6: Delete All Confirmation Sheet (Matches BS-06)
    function openDeleteAllConfirmationSheet() {
      openUniversalSheet(`
        <div class="text-center space-y-4 pt-2">
          <div class="w-16 h-16 rounded-full mx-auto flex items-center justify-center" style="background-color: var(--bg-error-soft); color: var(--color-error);">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </div>

          <div>
            <h3 class="text-xl font-bold ds-text-primary">مسح جميع البيانات</h3>
            <p class="text-[16px] ds-text-secondary mt-1.5 leading-relaxed">
              سيتم حذف جميع السور والأرباع المسجلة وسجل أيامك نهائياً. هل أنت متأكد؟
            </p>
          </div>

          <button type="button" onclick="confirmWipeAllData()" class="w-full h-14 rounded-full text-white font-medium text-[18px] flex items-center justify-center gap-2 active:scale-98 transition" style="background-color: var(--color-error);">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            <span>مسح جميع المحفوظات</span>
          </button>
        </div>
      `);
    }

    function openDeleteSurahSheet(surahId, surahName) {
      openUniversalSheet(`
        <div class="text-center space-y-4 pt-2">
          <div class="w-16 h-16 rounded-full mx-auto flex items-center justify-center" style="background-color: var(--bg-error-soft); color: var(--color-error);">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </div>

          <div>
            <h3 class="text-xl font-bold ds-text-primary">حذف سورة ${surahName}</h3>
            <p class="text-[16px] ds-text-secondary mt-1.5 leading-relaxed">
              هل أنت متأكد من حذف جميع أرباع سورة ${surahName} من محفوظاتك؟
            </p>
          </div>

          <button type="button" onclick="confirmDeleteSurahGroup(${surahId}, '${surahName}')" class="w-full h-14 rounded-full text-white font-medium text-[18px] flex items-center justify-center gap-2 active:scale-98 transition" style="background-color: var(--color-error);">
            <span>حذف السورة</span>
          </button>
        </div>
      `);
    }

    function confirmDeleteSurahGroup(surahId, surahName) {
      const removedIds = new Set(state.items.filter(i => i.surahId === surahId).map(i => i.id));
      state.items = state.items.filter(i => i.surahId !== surahId);
      state.recentAddedIds = state.recentAddedIds.filter(id => !removedIds.has(id));
      state.todaySession.farTasks = state.todaySession.farTasks.filter(t => !removedIds.has(t.itemId));
      state.todaySession.nearDoneIds = state.todaySession.nearDoneIds.filter(id => !removedIds.has(id));
      saveState();
      closeUniversalSheet();
      renderApp();
      showToast(`تم حذف سورة ${surahName}`, 'error');
    }

    function confirmWipeAllData() {
      const keepDark = state.darkMode;
      state = JSON.parse(JSON.stringify(defaultState));
      state.darkMode = keepDark;
      obChips = [];
      obScope = '';
      obFullPace = 0;
      saveState();
      closeUniversalSheet();
      enterOnboarding();
    }

    /**
     * =========================================================================
     * 8. INITIALIZATION & PWA SERVICE WORKER
     * =========================================================================
     */
    window.addEventListener('DOMContentLoaded', startAppFlow);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
